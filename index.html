        );
        const CopyPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="15" y1="12" x2="15" y2="18"/><line x1="12" y1="15" x2="18" y2="15"/><rect x="8" y="8" width="14" height="14" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const ChevronDown = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );

        // --- Collapsible Image Card Component ---
        const ImageCard = ({ img, isTemplated }) => {
            const [expanded, setExpanded] = useState(false);
            const hasMultiple = img.foundOn.length > 1;

            return (
                <div className={`flex items-start space-x-4 p-3 bg-[#151c2c] rounded-xl border border-slate-800 shadow-sm transition-all relative ${isTemplated ? 'hover:border-red-500/40' : 'hover:border-emerald-500/40'}`}>
                    
                    {/* Duplication Indicator Badge */}
                    {hasMultiple && (
                        <div className="absolute -top-2 -right-2 bg-yellow-500/90 text-yellow-950 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-md flex items-center border border-yellow-400 z-10">
                            <CopyPlus size={10} className="mr-1" />
                            Used on {img.foundOn.length} pages
                        </div>
                    )}

                    <div className="w-14 h-14 flex-shrink-0 bg-[#0f1524] rounded-lg overflow-hidden flex items-center justify-center border border-slate-800/60 mt-1">
                        <img src={img.src} alt={img.filename} className="w-full h-full object-cover opacity-90" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5Y2EzYWYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHg9IjMiIHk9IjMiIHJ4PSIyIiByeT0iMiIvPjxjaXJjbGUgY3g9IjkiIGN5PSI5IiByPSIyIi8+PHBhdGggZD0ibTIxIDE1LTMuMDgtMy4wOGExLjIgMS4yIDAgMCAwLTEuNzIgMGwtMS44MSAxLjgxTDEyLjkyIDExYTEuMiAxLjIgMCAwIDAtMS43MiAwbC04LjIgOC4xOSIvPjwvc3ZnPg=='}} />
                    </div>
                    <div className="min-w-0 flex-1">
                        <p className="text-sm font-bold text-slate-200 truncate" title={img.filename}>
                        {img.filename}
                        </p>
                        
                        <div className="flex items-center space-x-4 mt-0.5 mb-1">
                            <a href={img.src} target="_blank" rel="noreferrer" className={`text-[11px] font-medium flex items-center transition-colors ${isTemplated ? 'text-red-400 hover:text-red-300' : 'text-emerald-400 hover:text-emerald-300'}`}>
                                <LinkIcon size={10} className="mr-1" /> View Image
                            </a>
                            
                            {/* ONLY show the collapse button if there are multiple pages */}
                            {hasMultiple && (
                                <button onClick={() => setExpanded(!expanded)} className="text-[11px] font-medium text-slate-400 hover:text-slate-200 flex items-center transition-colors focus:outline-none">
                                    <ChevronDown size={12} className={`mr-1 transition-transform duration-200 ${expanded ? 'rotate-180' : ''}`} />
                                    {expanded ? 'Hide pages' : `${img.foundOn.length} pages`}
                                </button>
                            )}
                        </div>
                        
                        {/* Always show if single link, otherwise show when expanded */}
                        {(!hasMultiple || expanded) && (
                            <div className={`flex flex-col gap-1.5 mt-2 pt-2 ${hasMultiple ? 'border-t border-slate-800/60 animate-in fade-in slide-in-from-top-1 duration-200' : ''}`}>
                                {img.foundOn.map((pageUrl, idx) => {
                                    let displayPath = 'Homepage';
                                    try {
                                        const urlObj = new URL(pageUrl);
                                        let pName = urlObj.pathname;
                                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                                        if (pName && pName !== '') displayPath = pName;
                                    } catch(e) {}
                                    return (
                                        <a key={idx} href={pageUrl} target="_blank" rel="noreferrer" className={`inline-flex px-2 py-1 rounded text-[10px] font-medium border truncate w-fit max-w-full transition-colors ${isTemplated ? 'bg-red-500/5 text-red-400/90 border-red-500/20 hover:bg-red-500/10 hover:text-red-300' : 'bg-emerald-500/5 text-emerald-400/90 border-emerald-500/20 hover:bg-emerald-500/10 hover:text-emerald-300'}`} title={`Found on: ${pageUrl}`}>
                                            {displayPath}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Small thumbnail + filename cell used in the comparison table ---
        const ThumbCell = ({ img }) => {
            if (!img) return <span className="text-slate-600 text-xs">—</span>;
            return (
                <div className="flex items-center gap-2 min-w-0">
                    <div className="w-9 h-9 flex-shrink-0 bg-[#0f1524] rounded-md overflow-hidden border border-slate-800/60">
                        <img src={img.src} alt={img.filename} className="w-full h-full object-cover opacity-90" onError={(e) => { e.target.style.visibility = 'hidden'; }} />
                    </div>
                    <a href={img.src} target="_blank" rel="noreferrer" className="text-[11px] text-slate-300 hover:text-cyan-400 truncate max-w-[140px]" title={img.filename}>
                        {img.filename}
                    </a>
                </div>
            );
        };

        const statusBadgeClasses = (status) => {
            switch (status) {
                case 'TEMPLATE — EXACT': return 'bg-red-500/10 text-red-400 border-red-500/30';
                case 'TEMPLATE — RENAMED': return 'bg-orange-500/10 text-orange-400 border-orange-500/30';
                case 'TEMPLATE — MODIFIED': return 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                case 'CUSTOM — REPLACED': return 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
                case 'MISSING': return 'bg-slate-500/10 text-slate-400 border-slate-500/30';
                case 'NEW CUSTOM IMAGE': return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                case 'UNCERTAIN': return 'bg-purple-500/10 text-purple-400 border-purple-500/30';
                default: return 'bg-slate-500/10 text-slate-400 border-slate-500/30';
            }
        };

        const STATUS_CATEGORIES = ['TEMPLATE — EXACT', 'TEMPLATE — RENAMED', 'TEMPLATE — MODIFIED', 'CUSTOM — REPLACED', 'MISSING', 'NEW CUSTOM IMAGE', 'UNCERTAIN'];

        // --- Main Application ---
        function App() {
            const [builderUrl, setBuilderUrl] = useState('');
            const [templateUrl, setTemplateUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [error, setError] = useState('');
            const [results, setResults] = useState(null);

            // Helper to extract a normalized filename from a URL
            const getFilename = (urlStr) => {
                try {
                    const cleanUrl = urlStr.split('?')[0].split('#')[0];
                    const parts = cleanUrl.split('/');
                    let filename = parts[parts.length - 1];
                    
                    if (filename && filename.includes('.')) {
                        filename = decodeURIComponent(filename).trim();
                        
                        // Prevent redundant image tiles by aggressively stripping CDN resizing suffixes!
                        // Groups variants (e.g. image-1920w.jpg, image-150x150.jpg) into one clean tile.
                        let prevFilename;
                        do {
                            prevFilename = filename;
                            // Strip dimension suffixes like -150x150, _300x300, -1024xauto, -1920w, -1080h
                            filename = filename.replace(/[-_]\d+(?:x\d+|xauto|[wh])(?=\.[a-zA-Z0-9]+$)/i, '');
                            // Strip retina density suffixes like @2x, @3x
                            filename = filename.replace(/@\d+x(?=\.[a-zA-Z0-9]+$)/i, '');
                            // Strip typical builder descriptive suffixes like -mobile, -tablet, -opt, -thumb
                            filename = filename.replace(/[-_](?:mobile|tablet|desktop|thumb|thumbnail|small|medium|large|opt|compressed|resized|scaled|min)(?=\.[a-zA-Z0-9]+$)/i, '');
                        } while (filename !== prevFilename);

                        return filename;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            };

            // ============================================================
            // FUZZY FILENAME MATCHING
            // Reduces a filename to a bag of meaningful tokens, stripping the
            // extension and generic noise words builders/CMSs commonly add
            // (final, new, v2, copy, edited, optimized...) so "team.jpg" and
            // "team-final-v2.webp" are recognized as likely the same asset
            // even though nothing about them matches literally.
            // ============================================================
            const NOISE_TOKENS = new Set(['final', 'new', 'old', 'copy', 'edited', 'edit', 'updated', 'update', 'revised', 'revision', 'draft', 'output', 'optimized', 'optimised', 'compressed', 'resized', 'scaled', 'backup', 'v1', 'v2', 'v3', 'v4', 'min', 'web', 'image', 'img', 'photo', 'picture', 'file']);

            const coreTokens = (filename) => {
                if (!filename) return [];
                const noExt = filename.replace(/\.[a-zA-Z0-9]+$/, '');
                const raw = noExt.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                if (!raw) return [];
                return raw.split(' ').filter(t => t && !NOISE_TOKENS.has(t) && !/^\d+$/.test(t));
            };

            const coreTokenKey = (filename) => coreTokens(filename).sort().join(' ');

            // Simple Levenshtein distance for near-miss string comparison
            const levenshtein = (a, b) => {
                if (a === b) return 0;
                if (!a.length) return b.length;
                if (!b.length) return a.length;
                const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
                for (let i = 1; i <= a.length; i++) {
                    let cur = [i];
                    for (let j = 1; j <= b.length; j++) {
                        cur[j] = a[i - 1] === b[j - 1]
                            ? prev[j - 1]
                            : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
                    }
                    prev.splice(0, prev.length, ...cur);
                }
                return prev[b.length];
            };

            // Jaccard similarity between two filenames' token sets, with a
            // Levenshtein-based fallback for single-token names ("hero.jpg" vs
            // "banner.jpg") where token-set overlap alone can't discriminate.
            const filenameSimilarity = (fileA, fileB) => {
                const tokensA = coreTokens(fileA);
                const tokensB = coreTokens(fileB);
                if (tokensA.length === 0 || tokensB.length === 0) return 0;
                const setA = new Set(tokensA);
                const setB = new Set(tokensB);
                const intersection = [...setA].filter(t => setB.has(t)).length;
                const union = new Set([...setA, ...setB]).size;
                const jaccard = union === 0 ? 0 : intersection / union;

                const strA = tokensA.join('');
                const strB = tokensB.join('');
                const maxLen = Math.max(strA.length, strB.length) || 1;
                const editSim = 1 - (levenshtein(strA, strB) / maxLen);

                return Math.max(jaccard, editSim * 0.85);
            };

            // ============================================================
            // PERCEPTUAL IMAGE HASHING (dHash)
            // Loads an image directly in the browser (not through a proxy —
            // plain <img> loads aren't subject to fetch()'s CORS restrictions,
            // and if the user is logged into a gated preview site, the
            // browser's own session cookies are sent automatically). If the
            // image host allows cross-origin pixel reads we compute a 64-bit
            // difference hash; if not (tainted canvas) we still recover the
            // real rendered dimensions and fall back to metadata-only
            // comparison for that image.
            // ============================================================
            const computeImageSignature = (url, timeoutMs = 8000) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    let settled = false;
                    const finish = (val) => { if (!settled) { settled = true; resolve(val); } };
                    const timer = setTimeout(() => finish({ hash: null, width: null, height: null }), timeoutMs);

                    img.onload = () => {
                        clearTimeout(timer);
                        const width = img.naturalWidth || null;
                        const height = img.naturalHeight || null;
                        try {
                            const w = 9, h = 8;
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            const data = ctx.getImageData(0, 0, w, h).data; // throws if tainted
                            const gray = [];
                            for (let i = 0; i < data.length; i += 4) {
                                gray.push(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
                            }
                            let bits = '';
                            for (let row = 0; row < h; row++) {
                                for (let col = 0; col < w - 1; col++) {
                                    bits += gray[row * w + col] > gray[row * w + col + 1] ? '1' : '0';
                                }
                            }
                            let hex = '';
                            for (let i = 0; i < bits.length; i += 4) {
                                hex += parseInt(bits.substr(i, 4).padEnd(4, '0'), 2).toString(16);
                            }
                            finish({ hash: hex, width, height });
                        } catch (e) {
                            finish({ hash: null, width, height }); // cross-origin pixel read blocked
                        }
                    };
                    img.onerror = () => { clearTimeout(timer); finish({ hash: null, width: null, height: null }); };
                    img.src = url;
                });
            };

            const hammingDistanceHex = (h1, h2) => {
                if (!h1 || !h2 || h1.length !== h2.length) return null;
                let dist = 0;
                for (let i = 0; i < h1.length; i++) {
                    const xor = parseInt(h1[i], 16) ^ parseInt(h2[i], 16);
                    dist += (xor & 1) + ((xor >> 1) & 1) + ((xor >> 2) & 1) + ((xor >> 3) & 1);
                }
                return dist; // out of 64 bits total
            };

            // Runs `fn` over `items` with at most `limit` in flight at once —
            // hashing 100+ images at full concurrency would hammer the image
            // hosts and the browser's connection pool.
            const mapWithConcurrency = async (items, limit, fn) => {
                const results = new Array(items.length);
                let nextIndex = 0;
                const worker = async () => {
                    while (nextIndex < items.length) {
                        const current = nextIndex++;
                        results[current] = await fn(items[current], current);
                    }
                };
                await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
                return results;
            };

            // ============================================================
            // CORRESPONDING-PAGE HEURISTIC
            // Lets us recognize that /about and /about-us (or /services and
            // /services/web-design) likely represent "the same section" even
            // though the URLs don't literally match, so replaced-image
            // detection isn't limited to identical page paths.
            // ============================================================
            const PAGE_SYNONYMS = [
                ['about', 'about-us', 'aboutus', 'our-story', 'who-we-are'],
                ['contact', 'contact-us', 'contactus', 'get-in-touch'],
                ['service', 'services', 'our-services', 'what-we-do'],
                ['portfolio', 'gallery', 'our-work', 'work', 'projects', 'case-studies'],
                ['blog', 'news', 'articles', 'insights'],
                ['team', 'our-team', 'staff', 'people'],
                ['pricing', 'plans', 'packages'],
                ['faq', 'faqs', 'help', 'support'],
                ['home', 'index', ''],
            ];
            const synonymGroupFor = (slug) => PAGE_SYNONYMS.findIndex(group => group.includes(slug));

            const pathSlugs = (pathname) => {
                if (!pathname) return [''];
                const clean = pathname.toLowerCase().replace(/^\/|\/$/g, '');
                return clean === '' ? [''] : clean.split('/');
            };

            const pagesCorrespond = (pathA, pathB) => {
                if (pathA === pathB) return true;
                const slugsA = pathSlugs(pathA);
                const slugsB = pathSlugs(pathB);
                const lastA = slugsA[slugsA.length - 1];
                const lastB = slugsB[slugsB.length - 1];
                if (lastA === lastB) return true;
                const groupA = synonymGroupFor(lastA);
                const groupB = synonymGroupFor(lastB);
                if (groupA !== -1 && groupA === groupB) return true;
                return filenameSimilarity(lastA, lastB) >= 0.6;
            };

            const pathnameOf = (fullUrl) => {
                try {
                    const u = new URL(fullUrl);
                    let p = u.pathname;
                    if (p.endsWith('/') && p !== '/') p = p.slice(0, -1);
                    return p;
                } catch (e) { return '/'; }
            };

            // ============================================================
            // SITEMAP / ROBOTS.TXT DISCOVERY
            // Finds pages that may not be linked from the visible nav so the
            // crawler isn't limited to whatever it can click through.
            // ============================================================
            const discoverSitemapUrls = async (origin, siteLabel, failedPages) => {
                const candidateSitemaps = [];
                try {
                    const { html } = await fetchProxy(`${origin}/robots.txt`);
                    html.split('\n').forEach(line => {
                        const m = line.match(/^\s*sitemap:\s*(\S+)/i);
                        if (m) candidateSitemaps.push(m[1].trim());
                    });
                } catch (e) {
                    // robots.txt is optional — not every site has one, so this isn't
                    // logged as a scan failure, just skipped.
                }
                ['/sitemap.xml', '/sitemap_index.xml', '/sitemap-index.xml', '/wp-sitemap.xml'].forEach(p => {
                    const u = `${origin}${p}`;
                    if (!candidateSitemaps.includes(u)) candidateSitemaps.push(u);
                });

                const found = new Set();
                const queue = [...candidateSitemaps];
                let checked = 0;
                const maxSitemapFetches = 8;
                while (queue.length > 0 && checked < maxSitemapFetches) {
                    const sUrl = queue.shift();
                    checked++;
                    try {
                        const { html } = await fetchProxy(sUrl);
                        const doc = new DOMParser().parseFromString(html, 'text/xml');
                        if (doc.querySelector('parsererror')) continue;
                        const locs = Array.from(doc.querySelectorAll('loc')).map(n => n.textContent.trim());
                        if (doc.querySelector('sitemapindex')) {
                            locs.forEach(l => { if (queue.length + checked < maxSitemapFetches) queue.push(l); });
                        } else {
                            locs.forEach(l => found.add(l));
                        }
                    } catch (e) {
                        // Guessed default paths (sitemap.xml etc.) failing is normal
                        // and expected for most sites — silently skip and try the next.
                    }
                }
                return Array.from(found);
            };

            // Fetch with a hard timeout so a single hanging proxy can't stall the whole crawl
            const PROXY_TIMEOUT_MS = 15000;
            const fetchWithTimeout = async (url, timeoutMs = PROXY_TIMEOUT_MS) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    return await fetch(url, { signal: controller.signal, headers: { 'Accept': 'text/html,*/*' } });
                } finally {
                    clearTimeout(timer);
                }
            };

            // Heuristic: does this look like a bot-check / CAPTCHA / "enable JS" wall
            // rather than real page content? If so we still return the HTML (there may
            // be partial content) but flag it so the UI can warn the user.
            const looksLikeBlockedPage = (html) => {
                if (!html) return true;
                const lower = html.slice(0, 5000).toLowerCase();
                return (
                    lower.includes('cf-browser-verification') ||
                    lower.includes('attention required! | cloudflare') ||
                    lower.includes('checking your browser before accessing') ||
                    lower.includes('enable javascript and cookies to continue') ||
                    lower.includes('please verify you are a human') ||
                    lower.includes('captcha')
                );
            };

            // Multiple CORS proxies, tried in order. Each has its own response shape,
            // so each entry knows how to unwrap its own payload. If one is down,
            // rate-limited, or returns junk, we fall through to the next instead of
            // failing the whole page silently.
            const PROXIES = [
                {
                    name: 'allorigins (json)',
                    build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                    parse: async (res) => {
                        const data = await res.json();
                        if (!data || typeof data.contents !== 'string' || !data.contents) {
                            throw new Error('empty/invalid payload');
                        }
                        return data.contents;
                    }
                },
                {
                    name: 'allorigins (raw)',
                    build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    name: 'codetabs',
                    build: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    // corsproxy.io requires the target under a `url=` param — the old
                    // `?${encodeURIComponent(url)}` form (no `url=` key) is silently rejected.
                    name: 'corsproxy.io',
                    build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    name: 'thingproxy',
                    build: (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
                    parse: async (res) => res.text()
                },
                {
                    // r.jina.ai fetches the page through its own reader/renderer
                    // (executes JS, handles a lot of basic bot-checks) and returns
                    // readable text/markdown, including image links in the form
                    // ![alt](https://.../img.jpg). We don't DOM-parse this — the raw
                    // regex pass in extractDataFromHtml still picks up those image
                    // URLs directly out of the text, which also gives us a shot at
                    // JS-only pages the other proxies can never see.
                    name: 'r.jina.ai (reader)',
                    build: (url) => `https://r.jina.ai/${url}`,
                    parse: async (res) => res.text()
                },
            ];

            // Helper to fetch HTML through fallback proxies. Never fails silently:
            // if every proxy fails we throw a descriptive error listing exactly what
            // went wrong with each one, so the caller can surface real feedback
            // instead of a bare "0 results".
            //
            // Runs the full proxy chain, and if EVERY proxy fails on the first pass,
            // waits briefly and runs the whole chain again once more — a lot of these
            // free proxies fail transiently under rate limiting rather than being
            // truly down, and a short retry clears a surprising number of them.
            const attemptProxyChain = async (finalUrl) => {
                const attemptErrors = [];
                for (const proxy of PROXIES) {
                    try {
                        const response = await fetchWithTimeout(proxy.build(finalUrl));
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const html = await proxy.parse(response);
                        if (!html || html.length < 30) throw new Error('empty response body');
                        return { html, blocked: looksLikeBlockedPage(html), proxyUsed: proxy.name };
                    } catch (err) {
                        const reason = err.name === 'AbortError' ? 'timed out' : (err.message || 'unknown error');
                        attemptErrors.push(`${proxy.name} \u2192 ${reason}`);
                    }
                }
                return { errors: attemptErrors };
            };

            const fetchProxy = async (finalUrl) => {
                let result = await attemptProxyChain(finalUrl);
                if (!result.errors) return result;

                const firstPassErrors = result.errors;
                await new Promise(r => setTimeout(r, 1200));
                result = await attemptProxyChain(finalUrl);
                if (!result.errors) return result;

                // Diagnose the failure pattern so the user gets an actionable message
                // instead of a wall of proxy names.
                const allErrors = [...firstPassErrors, ...result.errors];
                const sawHttpStatus = allErrors.some(e => /HTTP \d{3}/.test(e));
                const sawOnlyNetworkErrors = allErrors.every(e => /timed out|failed to fetch|empty response|empty\/invalid payload/i.test(e));

                let hint;
                if (sawHttpStatus && !sawOnlyNetworkErrors) {
                    hint = 'at least one proxy reached the target and got an HTTP error back (e.g. 403) \u2014 the site itself is likely blocking automated/anonymous requests, or this is a private/preview link that requires being logged in.';
                } else if (sawOnlyNetworkErrors) {
                    hint = 'every proxy failed at the network level (timeout / failed to fetch) rather than returning an HTTP error \u2014 this usually means your current network, firewall, or browser policy is blocking these proxy domains outright. Try a different network, or disable any content-blocking extensions/policies for this page.';
                } else {
                    hint = 'see the per-proxy errors below for details.';
                }

                throw new Error(`All proxies failed for ${finalUrl} after 2 attempts (${hint}) [${allErrors.join(' | ')}]`);
            };

            // Helper to process a single page's HTML to find images AND internal links
            const extractDataFromHtml = (htmlContent, currentUrl, startUrl) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                const imagesList = [];
                const internalLinks = [];
                const startUrlObj = new URL(startUrl);

                // PROCESS IMAGE HELPER
                const processImageSrc = (src, alt) => {
                    if (!src || src.startsWith('data:')) return;
                    
                    let cleanSrc = src;
                    cleanSrc = cleanSrc.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                    
                    try {
                        const urlObj = new URL(cleanSrc, currentUrl);
                        cleanSrc = urlObj.toString();
                    } catch (e) { return; }

                    const filename = getFilename(cleanSrc);
                    if (filename) {
                        imagesList.push({ src: cleanSrc, filename, foundOn: currentUrl, alt: alt || '' });
                    }
                };

                // --- 1. EXTRACT LINKS & LIGHTBOX GALLERIES ---
                const processHref = (href) => {
                    if (!href || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
                    
                    // IF href is actually an image (Lightbox gallery popup link)
                    if (href.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                        processImageSrc(href);
                        return;
                    }

                    try {
                        const linkUrlObj = new URL(href, currentUrl);
                        if (linkUrlObj.hostname !== startUrlObj.hostname) return;
                        
                        const searchParams = new URLSearchParams(linkUrlObj.search);
                        const startParams = new URLSearchParams(startUrlObj.search);
                        startParams.forEach((value, key) => {
                            if (!searchParams.has(key)) searchParams.set(key, value);
                        });
                        linkUrlObj.search = searchParams.toString();
                        linkUrlObj.hash = '';
                        internalLinks.push(linkUrlObj.toString());
                    } catch (e) {}
                };

                // Standard a-tag links
                doc.querySelectorAll('a[href]').forEach(a => processHref(a.getAttribute('href')));

                // Builder specific links (dropdowns, dead-link wrappers)
                doc.querySelectorAll('[data-href], [data-url], [data-link]').forEach(el => {
                    processHref(el.getAttribute('data-href') || el.getAttribute('data-url') || el.getAttribute('data-link'));
                });

                // --- 2. EXTRACT IMAGES (Extremely Aggressive) ---
                
                // Helper: parse a full srcset string ("a.jpg 480w, b.jpg 800w") and
                // process every candidate, not just the first, so we don't miss the
                // real full-size asset when only a small variant is listed first.
                const processSrcset = (srcset) => {
                    if (!srcset) return;
                    srcset.split(',').forEach(part => {
                        const candidate = part.trim().split(/\s+/)[0];
                        if (candidate) processImageSrc(candidate);
                    });
                };

                // Standard & Lazy Loaded images (covers the most common lazy-load
                // attribute names used by builder platforms and lazy-load plugins)
                doc.querySelectorAll('img, source').forEach(img => {
                    const directSrc = img.getAttribute('src')
                        || img.getAttribute('data-src')
                        || img.getAttribute('data-original')
                        || img.getAttribute('data-lazy')
                        || img.getAttribute('data-lazy-src')
                        || img.getAttribute('data-bg')
                        || img.getAttribute('data-background');
                    const altText = img.getAttribute('alt') || '';
                    if (directSrc) processImageSrc(directSrc, altText);
                    processSrcset(img.getAttribute('srcset') || img.getAttribute('data-srcset'));
                });

                // <noscript> fallback images: many lazy-load plugins (and page builders
                // like Duda/Wix/WordPress) render the REAL <img src="..."> only inside
                // a <noscript> block as a no-JS fallback, while the visible tag carries
                // just a lazy-load placeholder. DOMParser does NOT parse noscript
                // contents as elements, so we have to re-parse its text content.
                doc.querySelectorAll('noscript').forEach(ns => {
                    const raw = ns.textContent;
                    if (raw && raw.toLowerCase().includes('<img')) {
                        try {
                            const fragDoc = parser.parseFromString(raw, 'text/html');
                            fragDoc.querySelectorAll('img, source').forEach(img => {
                                const s = img.getAttribute('src') || img.getAttribute('data-src');
                                if (s) processImageSrc(s);
                                processSrcset(img.getAttribute('srcset'));
                            });
                        } catch (e) {}
                    }
                });

                // Social/meta preview images — often the hero/banner image and a
                // useful signal even when the rest of the page is JS-rendered
                doc.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"]').forEach(m => {
                    processImageSrc(m.getAttribute('content'));
                });

                // Scan EVERY attribute on EVERY element to prevent missing custom hidden images
                doc.querySelectorAll('*').forEach(el => {
                    Array.from(el.attributes).forEach(attr => {
                        const val = attr.value;
                        if (!val) return;

                        // Check if attribute contains an inline style/url format
                        if (val.includes('url(')) {
                            const urls = val.match(/url\(['"]?(.*?)['"]?\)/g);
                            if (urls) {
                                urls.forEach(u => {
                                    const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                    if (match && match[1] && !match[1].startsWith('data:')) processImageSrc(match[1]);
                                });
                            }
                        }
                        
                        // Check if the attribute value IS literally an image URL
                        if (val.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                            processImageSrc(val);
                        }
                    });
                });

                // Internal <style> tags
                doc.querySelectorAll('style').forEach(styleTag => {
                    const cssText = styleTag.textContent;
                    if (cssText) {
                        const urls = cssText.match(/url\(['"]?(.*?)['"]?\)/g);
                        if (urls) {
                            urls.forEach(u => {
                                const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                if (match && match[1] && !match[1].startsWith('data:') && !match[1].endsWith('.woff') && !match[1].endsWith('.woff2')) {
                                    processImageSrc(match[1]);
                                }
                            });
                        }
                    }
                });

                // --- 3. BRUTE FORCE RAW HTML PARSE (For Javascript/JSON galleries & absolute/relative paths) ---
                const rawUrlRegex = /(?:https?:\/\/|\/)[^\s"',;<>()[\]]+\.(?:jpg|jpeg|png|gif|webp|svg)(?:\?[^\s"',;<>()[\]]+)?/gi;
                const rawMatches = htmlContent.match(rawUrlRegex);
                if (rawMatches) {
                    rawMatches.forEach(url => processImageSrc(url));
                }

                // Detect a near-empty "app shell" (e.g. <div id="root"></div> plus a
                // bundle.js) — a strong sign this page only renders its real content
                // client-side via JavaScript, which a static proxy fetch can never see.
                const bodyText = (doc.body && doc.body.textContent) ? doc.body.textContent.trim() : '';
                const bodyElementCount = doc.body ? doc.body.querySelectorAll('*').length : 0;
                const looksLikeEmptySpaShell = imagesList.length === 0 && bodyText.length < 40 && bodyElementCount < 15;

                return { images: imagesList, links: [...new Set(internalLinks)], looksLikeEmptySpaShell };
            };

            // FULL SITE CRAWLER: Uses a dynamic deep-dive queue to explore links found on
            // subpages, seeded up front with anything sitemap.xml/robots.txt reveal so
            // pages missing from the visible nav still get scanned.
            const crawlSiteAndExtractImages = async (startUrl, siteLabel) => {
                let finalStartUrl = startUrl;
                if (!/^https?:\/\//i.test(finalStartUrl)) {
                    finalStartUrl = 'https://' + finalStartUrl;
                }
                const origin = new URL(finalStartUrl).origin;

                const allImages = [];
                const visited = new Set();
                const discovered = new Set([finalStartUrl]); // every unique URL ever seen, even beyond the cap
                const queue = [finalStartUrl];
                const maxPages = 60; // Deep crawl limit
                const batchSize = 5;

                const prioritizeKeywords = ['service', 'services', 'gallery', 'portfolio', 'about', 'our-work'];

                // Collected problems encountered along the way, both as plain text
                // (for logs) and as structured rows (for the Failed/Inaccessible
                // Pages table) — surfaced in the UI instead of being swallowed into
                // a bare 0-results.
                const warnings = [];
                const failedPages = [];
                let pagesFetchedOk = 0;

                setStatusText(`Checking ${siteLabel} sitemap & robots.txt...`);
                try {
                    const sitemapUrls = await discoverSitemapUrls(origin, siteLabel, failedPages);
                    sitemapUrls.forEach(u => {
                        try {
                            if (new URL(u).origin === origin && !discovered.has(u)) {
                                discovered.add(u);
                                queue.push(u);
                            }
                        } catch (e) {}
                    });
                } catch (e) {
                    // Sitemap discovery is a bonus, not a requirement — crawling via
                    // links still proceeds normally if this fails entirely.
                }

                // Continue scanning as long as there are pages in the queue (up to the limit)
                while (queue.length > 0 && visited.size < maxPages) {
                    const currentBatch = [];
                    // Take the next batch of unvisited pages
                    while (queue.length > 0 && currentBatch.length < batchSize && visited.size + currentBatch.length < maxPages) {
                        const url = queue.shift();
                        if (!visited.has(url)) {
                            visited.add(url);
                            currentBatch.push(url);
                        }
                    }

                    if (currentBatch.length === 0) break;

                    setStatusText(`Scanning ${siteLabel}: Crawled ${visited.size} pages (${discovered.size} discovered)...`);

                    // Fetch the batch of pages simultaneously
                    const batchPromises = currentBatch.map(async (url) => {
                        try {
                            const { html, blocked, proxyUsed } = await fetchProxy(url);
                            pagesFetchedOk++;
                            if (blocked) {
                                warnings.push(`${siteLabel}: ${url} looks like a bot-check/CAPTCHA page (via ${proxyUsed}) — its images may be missing from results.`);
                                failedPages.push({ site: siteLabel, url, problem: `Bot-check/CAPTCHA page detected (via ${proxyUsed})`, impact: 'Images on this page may be missing or incomplete' });
                            }
                            const result = extractDataFromHtml(html, url, finalStartUrl);
                            if (result.looksLikeEmptySpaShell) {
                                warnings.push(`${siteLabel}: ${url} returned almost no HTML content — it's likely a JavaScript-rendered app whose images can't be seen by a static scan.`);
                                failedPages.push({ site: siteLabel, url, problem: 'Page appears to be a JavaScript-rendered app shell with no static HTML', impact: 'Images on this page cannot be seen by a static scan' });
                            }
                            return result;
                        } catch (err) {
                            warnings.push(`${siteLabel}: Failed to scan ${url} — ${err.message}`);
                            failedPages.push({ site: siteLabel, url, problem: err.message || 'Failed to fetch', impact: 'Page could not be scanned at all — images on it are unknown' });
                            return { images: [], links: [] };
                        }
                    });

                    const batchResults = await Promise.all(batchPromises);

                    // Add extracted images and queue up newly discovered links
                    batchResults.forEach(({ images, links }) => {
                        allImages.push(...(images || []));

                        (links || []).forEach(link => {
                            if (!discovered.has(link)) discovered.add(link);
                            if (!visited.has(link) && !queue.includes(link)) {
                                queue.push(link);
                            }
                        });
                    });

                    // Sort the queue to always prioritize scanning services & galleries first
                    queue.sort((a, b) => {
                        const aStr = a.toLowerCase();
                        const bStr = b.toLowerCase();
                        const aMatch = prioritizeKeywords.some(k => aStr.includes(k));
                        const bMatch = prioritizeKeywords.some(k => bStr.includes(k));
                        
                        if (aMatch && !bMatch) return -1;
                        if (!aMatch && bMatch) return 1;
                        return 0;
                    });

                    // Small stagger between batches — several of the free proxies
                    // (codetabs, thingproxy) apply per-second rate limits, and firing
                    // batch after batch back-to-back trips them into 429s/blocks.
                    if (queue.length > 0 && visited.size < maxPages) {
                        await new Promise(r => setTimeout(r, 350));
                    }
                }

                if (pagesFetchedOk === 0) {
                    warnings.push(`${siteLabel}: Every page fetch failed — no pages could be reached through any proxy. See details above.`);
                }

                // Group by filename (case-insensitive key, since some CDNs vary
                // casing for what's otherwise the identical asset) and collect all
                // unique URLs where the image was found, plus a fuzzy core-token key
                // and any alt text spotted for that asset.
                const imageMap = new Map();
                allImages.forEach(item => {
                    let pathKey = 'Homepage';
                    try {
                        const urlObj = new URL(item.foundOn);
                        let pName = urlObj.pathname;
                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                        if (pName && pName !== '') pathKey = pName;
                    } catch(e) {}

                    const matchKey = item.filename.toLowerCase();

                    if (!imageMap.has(matchKey)) {
                        const foundOnMap = new Map();
                        foundOnMap.set(pathKey, item.foundOn);
                        
                        imageMap.set(matchKey, {
                            src: item.src,
                            filename: item.filename,
                            matchKey,
                            coreKey: coreTokenKey(item.filename),
                            alt: item.alt || '',
                            foundOnMap: foundOnMap
                        });
                    } else {
                        const existing = imageMap.get(matchKey);
                        existing.foundOnMap.set(pathKey, item.foundOn);
                        if (!existing.alt && item.alt) existing.alt = item.alt;
                    }
                });

                const uniqueImages = Array.from(imageMap.values()).map(img => {
                    const foundUrls = Array.from(img.foundOnMap.values());
                    delete img.foundOnMap;
                    return {
                        ...img,
                        foundOn: foundUrls,
                        hash: null,
                        width: null,
                        height: null,
                    };
                });
                
                return {
                    images: uniqueImages,
                    warnings,
                    failedPages,
                    discoveredCount: discovered.size,
                    scannedCount: pagesFetchedOk,
                    failedCount: visited.size - pagesFetchedOk,
                };
            };

            // ============================================================
            // TEMPLATE DETECTION ENGINE
            // Runs filename/fuzzy/visual-hash matching between the two image
            // sets and classifies every image into one of the required
            // categories (TEMPLATE — EXACT/RENAMED/MODIFIED, CUSTOM — REPLACED,
            // MISSING, NEW CUSTOM IMAGE, UNCERTAIN).
            // ============================================================
            const HASH_CAP_PER_SITE = 120;

            const compareSites = async (builderImages, templateImages) => {
                const toHash = [
                    ...templateImages.slice(0, HASH_CAP_PER_SITE),
                    ...builderImages.slice(0, HASH_CAP_PER_SITE),
                ];
                if (toHash.length > 0) {
                    setStatusText(`Visually comparing ${toHash.length} images (loading + hashing)...`);
                    await mapWithConcurrency(toHash, 8, async (img) => {
                        const sig = await computeImageSignature(img.src);
                        img.hash = sig.hash;
                        img.width = sig.width;
                        img.height = sig.height;
                    });
                }

                setStatusText('Classifying images...');

                const matchedT = new Array(templateImages.length).fill(false);
                const matchedB = new Array(builderImages.length).fill(false);
                const rows = [];

                const pushRow = (tIdx, bIdx, status, confidence, explanation, match) => {
                    const t = tIdx !== null && tIdx !== -1 ? templateImages[tIdx] : null;
                    const b = bIdx !== null && bIdx !== -1 ? builderImages[bIdx] : null;
                    rows.push({
                        templatePage: t ? pathnameOf(t.foundOn[0]) : '—',
                        templateImage: t,
                        myPage: b ? pathnameOf(b.foundOn[0]) : '—',
                        myImage: b,
                        match,
                        status,
                        confidence: Math.max(0, Math.min(100, Math.round(confidence))),
                        explanation,
                    });
                    if (t) matchedT[tIdx] = true;
                    if (b) matchedB[bIdx] = true;
                };

                // PASS 1/2 — perceptual hash (actual visual content) comparison.
                // This is the strongest evidence available and runs first,
                // regardless of what the filenames look like.
                builderImages.forEach((b, bIdx) => {
                    if (matchedB[bIdx] || !b.hash) return;
                    let bestIdx = -1, bestDist = Infinity;
                    templateImages.forEach((t, tIdx) => {
                        if (matchedT[tIdx] || !t.hash) return;
                        const d = hammingDistanceHex(b.hash, t.hash);
                        if (d !== null && d < bestDist) { bestDist = d; bestIdx = tIdx; }
                    });
                    if (bestIdx === -1) return;
                    if (bestDist <= 4) {
                        const sameName = b.matchKey === templateImages[bestIdx].matchKey;
                        pushRow(bestIdx, bIdx,
                            sameName ? 'TEMPLATE — EXACT' : 'TEMPLATE — RENAMED',
                            sameName ? 99 : 96,
                            sameName
                                ? 'Identical filename and visually identical pixel content (verified by direct image comparison).'
                                : 'Visually identical pixel content (verified by direct image comparison); only the filename/format changed.',
                            'Yes');
                    } else if (bestDist <= 16) {
                        pushRow(bestIdx, bIdx, 'TEMPLATE — MODIFIED', Math.max(55, 92 - bestDist * 2),
                            `Same underlying image but visually altered (pixel-hash distance ${bestDist}/64) — likely cropped, filtered, recolored, resized, or recompressed.`, 'Yes');
                    }
                });

                // PASS 3 — exact filename / core-token match for anything not
                // resolved visually (hash unavailable due to CORS, or too
                // different to call a hash match).
                builderImages.forEach((b, bIdx) => {
                    if (matchedB[bIdx]) return;
                    let tIdx = templateImages.findIndex((t, i) => !matchedT[i] && t.matchKey === b.matchKey);
                    if (tIdx !== -1) {
                        const bothHashed = !!(b.hash && templateImages[tIdx].hash);
                        pushRow(tIdx, bIdx, 'TEMPLATE — EXACT', bothHashed ? 90 : 76,
                            bothHashed
                                ? 'Identical filename; hash comparison was inconclusive but names match exactly.'
                                : 'Identical filename. Visual content could not be verified (image blocked cross-origin pixel access), so this is filename-based evidence only.',
                            'Yes');
                        return;
                    }
                    tIdx = templateImages.findIndex((t, i) => !matchedT[i] && t.coreKey && t.coreKey === b.coreKey);
                    if (tIdx !== -1) {
                        pushRow(tIdx, bIdx, 'TEMPLATE — RENAMED', 72,
                            'Filename matches after stripping the extension/format and common suffixes (e.g. "-final", "-v2", "-copy") — likely the same asset renamed or re-exported.',
                            'Yes');
                    }
                });

                // PASS 4 — fuzzy filename similarity for whatever's left.
                builderImages.forEach((b, bIdx) => {
                    if (matchedB[bIdx]) return;
                    let bestIdx = -1, bestSim = 0;
                    templateImages.forEach((t, tIdx) => {
                        if (matchedT[tIdx]) return;
                        const sim = filenameSimilarity(b.filename, t.filename);
                        if (sim > bestSim) { bestSim = sim; bestIdx = tIdx; }
                    });
                    if (bestIdx === -1) return;
                    if (bestSim >= 0.72) {
                        pushRow(bestIdx, bIdx, 'TEMPLATE — RENAMED', Math.round(48 + bestSim * 25),
                            `Filenames are similar but not identical (~${Math.round(bestSim * 100)}% token match) — likely the same image renamed. Not visually verified.`, 'Yes');
                    } else if (bestSim >= 0.45) {
                        pushRow(bestIdx, bIdx, 'UNCERTAIN', Math.round(25 + bestSim * 20),
                            `Filenames share partial similarity (~${Math.round(bestSim * 100)}% token match) — not strong enough to confirm the same image without a working visual comparison.`, 'Partial');
                    }
                });

                // PASS 5 — remaining template images: check for a same-section
                // replacement on the builder site before giving up as MISSING.
                templateImages.forEach((t, tIdx) => {
                    if (matchedT[tIdx]) return;
                    const tPage = pathnameOf(t.foundOn[0]);
                    const replacementIdx = builderImages.findIndex((b, bIdx) =>
                        !matchedB[bIdx] && b.foundOn.some(f => pagesCorrespond(tPage, pathnameOf(f)))
                    );
                    if (replacementIdx !== -1) {
                        pushRow(tIdx, replacementIdx, 'CUSTOM — REPLACED', 52,
                            `No matching image found on your site, but a different image appears in what looks like the corresponding page/section (${tPage} ↔ ${pathnameOf(builderImages[replacementIdx].foundOn[0])}) — likely a direct replacement rather than a missing asset.`,
                            'No');
                    } else {
                        pushRow(tIdx, null, 'MISSING', 80,
                            'This template image was not found anywhere on your site after a full scan of all reachable pages.', 'No');
                    }
                });

                // PASS 6 — anything left on the builder site has no template counterpart at all.
                builderImages.forEach((b, bIdx) => {
                    if (matchedB[bIdx]) return;
                    pushRow(null, bIdx, 'NEW CUSTOM IMAGE', 85,
                        'This image exists on your site but has no counterpart anywhere on the template site.', 'No');
                });

                const statusCounts = {};
                rows.forEach(r => { statusCounts[r.status] = (statusCounts[r.status] || 0) + 1; });

                const templateDerivedCount = (statusCounts['TEMPLATE — EXACT'] || 0)
                    + (statusCounts['TEMPLATE — RENAMED'] || 0)
                    + (statusCounts['TEMPLATE — MODIFIED'] || 0);
                const percentage = builderImages.length > 0
                    ? Math.round((templateDerivedCount / builderImages.length) * 100)
                    : 0;

                const statusOrder = ['TEMPLATE — EXACT', 'TEMPLATE — RENAMED', 'TEMPLATE — MODIFIED', 'CUSTOM — REPLACED', 'MISSING', 'NEW CUSTOM IMAGE', 'UNCERTAIN'];
                rows.sort((a, b) => statusOrder.indexOf(a.status) - statusOrder.indexOf(b.status));

                return { rows, statusCounts, percentage, templateDerivedCount };
            };

            const handleScan = async (e) => {
                e.preventDefault();
                if (!builderUrl || !templateUrl) {
                    setError('Please provide both URLs.');
                    return;
                }

                setLoading(true);
                setError('');
                setResults(null);

                try {
                    const builderResult = await crawlSiteAndExtractImages(builderUrl, 'Builder Site');
                    const templateResult = await crawlSiteAndExtractImages(templateUrl, 'Template Site');

                    const builderImages = builderResult.images;
                    const templateImages = templateResult.images;
                    const warnings = [...builderResult.warnings, ...templateResult.warnings];
                    const failedPages = [...templateResult.failedPages, ...builderResult.failedPages];

                    // If literally nothing was found on either site, don't just show
                    // empty tables — tell the user why, since 0/0 usually means the
                    // scan itself broke rather than the sites being genuinely empty.
                    if (builderImages.length === 0 && templateImages.length === 0) {
                        const warningText = warnings.join(' ').toLowerCase();
                        const sawHttpBlock = /http \d{3}/.test(warningText);
                        const sawOnlyNetworkIssues = warnings.length > 0 && !sawHttpBlock;

                        let reason;
                        if (sawHttpBlock) {
                            reason = 'At least one proxy reached the site but got an HTTP error back — the site is likely blocking automated/anonymous requests, or the URL is a private preview link that requires being logged in to view.';
                        } else if (sawOnlyNetworkIssues) {
                            reason = 'Every proxy attempt failed at the network level (timeouts / failed to fetch) rather than getting a response from the site. This points to your current network, firewall, or browser policy blocking the proxy services themselves — try a different network or disabling content-blocking extensions for this page.';
                        } else {
                            reason = 'This usually means the sites blocked automated fetching, render their images entirely via JavaScript, or the free CORS proxies are temporarily unavailable.';
                        }
                        setError(`No images were found on either site after scanning all reachable pages. ${reason} Check the Failed/Inaccessible Pages table below for the specific reason per page.`);
                        return;
                    }

                    const comparison = await compareSites(builderImages, templateImages);

                    setResults({
                        builderScan: {
                            discovered: builderResult.discoveredCount,
                            scanned: builderResult.scannedCount,
                            failed: builderResult.failedCount,
                            images: builderImages.length,
                        },
                        templateScan: {
                            discovered: templateResult.discoveredCount,
                            scanned: templateResult.scannedCount,
                            failed: templateResult.failedCount,
                            images: templateImages.length,
                        },
                        rows: comparison.rows,
                        statusCounts: comparison.statusCounts,
                        percentage: comparison.percentage,
                        failedPages,
                    });

                } catch (err) {
                    setError(err.message || 'An error occurred while scanning. Ensure adblockers are disabled for this site.');
                } finally {
                    setLoading(false);
                    setStatusText('');
                }
            };

            return (
                <div className="min-h-screen font-sans p-6">
                <div className="max-w-4xl mx-auto space-y-8">
                    
                    {/* Header Section */}
                    <div className="bg-[#151c2c] rounded-2xl shadow-2xl border border-slate-800/60 p-8 relative overflow-hidden">
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-24 bg-cyan-500/10 blur-[60px] pointer-events-none"></div>

                    <div className="flex flex-col items-center text-center mb-8 relative z-10">
                        <div className="p-3 bg-cyan-400/10 text-cyan-400 rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.2)] mb-4 border border-cyan-400/20">
                        <ImageIcon size={28} />
                        </div>
                        <h1 className="text-3xl font-bold text-white mb-2">Templated Image Finder</h1>
                        <p className="text-slate-400 max-w-2xl text-sm">
                        Fast scan to compare all pages, standard images, background images, and hidden galleries. Made by JSB
                        </p>
                    </div>

                    {/* Form */}
                    <form onSubmit={handleScan} className="mt-8 space-y-6 relative z-10">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="block text-sm font-medium text-slate-300">Builder Link</label>
                            <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <LinkIcon size={16} className="text-slate-500" />
                            </div>
                            <input
                                type="text"
                                value={builderUrl}
                                onChange={(e) => setBuilderUrl(e.target.value)}
                                placeholder="Paste the builder link here..."
                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                required
                            />
                            </div>
                        </div>
                        
                        <div className="space-y-2">
                            <label className="block text-sm font-medium text-slate-300">Template Link</label>
                            <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <LinkIcon size={16} className="text-slate-500" />
                            </div>
                            <input
                                type="text"
                                value={templateUrl}
                                onChange={(e) => setTemplateUrl(e.target.value)}
                                placeholder="Paste the template link here..."
                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                required
                            />
                            </div>
                        </div>
                        </div>

                        {error && (
                        <div className="p-4 bg-red-950/30 border border-red-900/50 text-red-400 rounded-xl flex items-start space-x-3">
                            <AlertCircle size={20} className="mt-0.5 flex-shrink-0" />
                            <p className="text-sm">{error}</p>
                        </div>
                        )}

                        <div className="flex flex-col md:flex-row items-center gap-4 pt-2">
                        <button
                            type="submit"
                            disabled={loading}
                            className="w-full md:w-auto px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-xl shadow-[0_0_15px_rgba(8,145,178,0.3)] transition-all flex items-center justify-center space-x-2 disabled:opacity-50 disabled:bg-slate-800 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed"
                        >
                            {loading ? (
                            <React.Fragment>
                                <Loader2 size={18} className="animate-spin" />
                                <span>Fast Scanning...</span>
                            </React.Fragment>
                            ) : (
                            <React.Fragment>
                                <Search size={18} />
                                <span>Find Templated Images</span>
                            </React.Fragment>
                            )}
                        </button>
                        
                        {/* Live Status Indicator */}
                        {statusText && (
                            <div className="flex items-center space-x-2 text-sm font-medium text-cyan-400 bg-cyan-950/30 px-4 py-3 rounded-xl animate-pulse border border-cyan-900/50">
                            <Loader2 size={16} className="animate-spin" />
                            <span>{statusText}</span>
                            </div>
                        )}
                        </div>
                    </form>
                    </div>

                    {/* Focused Results Section */}
                    {results && (
                    <div className="space-y-8 animate-in fade-in duration-500">

                        {/* 1. Website Scan Summary */}
                        <div className="bg-[#151c2c] rounded-2xl shadow-xl border border-slate-800 overflow-hidden">
                            <div className="bg-[#0f1524] p-4 border-b border-slate-800/60">
                                <h3 className="font-semibold text-slate-200 text-sm">Website Scan Summary</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left">
                                    <thead className="text-slate-500 uppercase text-[10px] border-b border-slate-800">
                                        <tr>
                                            <th className="p-3">Website</th>
                                            <th className="p-3">Pages Discovered</th>
                                            <th className="p-3">Pages Scanned</th>
                                            <th className="p-3">Pages Failed</th>
                                            <th className="p-3">Images Found</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/60">
                                        <tr>
                                            <td className="p-3 font-medium text-slate-300">Template Website</td>
                                            <td className="p-3 text-slate-300">{results.templateScan.discovered}</td>
                                            <td className="p-3 text-slate-300">{results.templateScan.scanned}</td>
                                            <td className="p-3 text-slate-300">{results.templateScan.failed}</td>
                                            <td className="p-3 text-slate-300">{results.templateScan.images}</td>
                                        </tr>
                                        <tr>
                                            <td className="p-3 font-medium text-slate-300">My Website</td>
                                            <td className="p-3 text-slate-300">{results.builderScan.discovered}</td>
                                            <td className="p-3 text-slate-300">{results.builderScan.scanned}</td>
                                            <td className="p-3 text-slate-300">{results.builderScan.failed}</td>
                                            <td className="p-3 text-slate-300">{results.builderScan.images}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* 2. Overall Template Image Usage banner */}
                        <div className="bg-gradient-to-r from-cyan-950/40 to-[#151c2c] border border-cyan-900/40 rounded-2xl p-6 text-center">
                            <p className="text-xs uppercase tracking-wider text-cyan-400/80 font-bold mb-2">Overall Template Image Usage</p>
                            <p className="text-4xl font-black text-white mb-2">{results.percentage}%</p>
                            <p className="text-sm text-slate-300 max-w-xl mx-auto">
                                Your website still uses approximately <span className="text-cyan-400 font-semibold">{results.percentage}%</span> of the template's original imagery.
                            </p>
                            <p className="text-[11px] text-slate-500 mt-3 max-w-xl mx-auto leading-relaxed">
                                Calculated as (Exact + Renamed + Modified template matches) ÷ (total images found on your site) × 100. Matches based only on filename evidence (image blocked cross-origin pixel comparison) still count toward this total, so treat it as a strong estimate rather than an exact figure.
                            </p>
                        </div>

                        {/* 3. Category breakdown cards */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            {STATUS_CATEGORIES.map((label) => (
                                <div key={label} className="bg-[#151c2c] p-4 rounded-xl border border-slate-800 text-center">
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-wide mb-1 leading-tight">{label}</p>
                                    <p className="text-2xl font-black text-white">{results.statusCounts[label] || 0}</p>
                                </div>
                            ))}
                        </div>

                        {/* 4. Image Comparison Table */}
                        <div className="bg-[#151c2c] rounded-2xl shadow-xl border border-slate-800 overflow-hidden">
                            <div className="bg-[#0f1524] p-4 border-b border-slate-800/60 flex items-center justify-between">
                                <h3 className="font-semibold text-slate-200 flex items-center text-sm">
                                    <ImageIcon size={16} className="mr-2 text-cyan-400" />
                                    Image Comparison
                                </h3>
                                <span className="px-2.5 py-0.5 bg-slate-700/30 text-slate-300 border border-slate-600/30 rounded-full text-xs font-bold">
                                    {results.rows.length} rows
                                </span>
                            </div>
                            <div className="overflow-auto max-h-[720px] custom-scroll">
                                <table className="w-full text-xs text-left border-collapse">
                                    <thead className="text-slate-500 uppercase text-[10px] bg-[#0f1524] sticky top-0 z-10">
                                        <tr>
                                            <th className="p-3">#</th>
                                            <th className="p-3">Template Page</th>
                                            <th className="p-3">Template Image</th>
                                            <th className="p-3">My Page</th>
                                            <th className="p-3">My Image</th>
                                            <th className="p-3">Match</th>
                                            <th className="p-3">Status</th>
                                            <th className="p-3">Confidence</th>
                                            <th className="p-3 min-w-[240px]">Explanation</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/60">
                                        {results.rows.map((row, i) => (
                                            <tr key={i} className="hover:bg-[#0f1524]/60 align-top">
                                                <td className="p-3 text-slate-500">{i + 1}</td>
                                                <td className="p-3 text-slate-400 max-w-[120px] truncate" title={row.templatePage}>{row.templatePage}</td>
                                                <td className="p-3"><ThumbCell img={row.templateImage} /></td>
                                                <td className="p-3 text-slate-400 max-w-[120px] truncate" title={row.myPage}>{row.myPage}</td>
                                                <td className="p-3"><ThumbCell img={row.myImage} /></td>
                                                <td className="p-3 text-slate-400">{row.match}</td>
                                                <td className="p-3">
                                                    <span className={`inline-block px-2 py-0.5 rounded-full border text-[10px] font-bold whitespace-nowrap ${statusBadgeClasses(row.status)}`}>
                                                        {row.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-slate-300 font-semibold">{row.confidence}%</td>
                                                <td className="p-3 text-slate-500 leading-relaxed">{row.explanation}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* 5. Failed / Inaccessible Pages */}
                        {results.failedPages && results.failedPages.length > 0 && (
                        <div className="bg-[#151c2c] rounded-2xl shadow-xl border border-amber-900/40 overflow-hidden">
                            <div className="bg-[#0f1524] p-4 border-b border-slate-800/60 flex items-center">
                                <AlertTriangle size={16} className="mr-2 text-amber-500 flex-shrink-0" />
                                <h3 className="font-semibold text-slate-200 text-sm">Failed / Inaccessible Pages ({results.failedPages.length})</h3>
                            </div>
                            <div className="overflow-auto max-h-[400px] custom-scroll">
                                <table className="w-full text-xs text-left">
                                    <thead className="text-slate-500 uppercase text-[10px] bg-[#0f1524] sticky top-0">
                                        <tr>
                                            <th className="p-3">Site</th>
                                            <th className="p-3">URL</th>
                                            <th className="p-3">Problem</th>
                                            <th className="p-3">Impact</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/60">
                                        {results.failedPages.map((fp, i) => (
                                            <tr key={i}>
                                                <td className="p-3 text-slate-400 whitespace-nowrap">{fp.site}</td>
                                                <td className="p-3 text-slate-400 max-w-[220px] truncate" title={fp.url}>
                                                    <a href={fp.url} target="_blank" rel="noreferrer" className="hover:text-cyan-400">{fp.url}</a>
                                                </td>
                                                <td className="p-3 text-amber-400/90">{fp.problem}</td>
                                                <td className="p-3 text-slate-500">{fp.impact}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        )}

                    </div>
                    )}

                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
