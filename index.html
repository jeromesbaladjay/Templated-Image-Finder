<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templated Image Finder</title>
<link rel="icon" type="Logo.png" href="Logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for dark mode */

</head>
<body class="bg-[#0B1120] text-slate-300 selection:bg-cyan-500/30 selection:text-cyan-100 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Inline SVG Icons ---
        const Search = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const ImageIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.08-3.08a1.2 1.2 0 0 0-1.72 0l-1.81 1.81L12.92 11a1.2 1.2 0 0 0-1.72 0l-8.2 8.19"/></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const Loader2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        );
        const LinkIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        );
        const AlertTriangle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        );
        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        );
        const CopyPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="15" y1="12" x2="15" y2="18"/><line x1="12" y1="15" x2="18" y2="15"/><rect x="8" y="8" width="14" height="14" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const ChevronDown = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );

        // --- Collapsible Image Card Component ---
        const ImageCard = ({ img, isTemplated }) => {
            const [expanded, setExpanded] = useState(false);
            const hasMultiple = img.foundOn.length > 1;

            return (
                <div className={`flex items-start space-x-4 p-3 bg-[#151c2c] rounded-xl border border-slate-800 shadow-sm transition-all relative ${isTemplated ? 'hover:border-red-500/40' : 'hover:border-emerald-500/40'}`}>
                    
                    {/* Duplication Indicator Badge */}
                    {hasMultiple && (
                        <div className="absolute -top-2 -right-2 bg-yellow-500/90 text-yellow-950 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-md flex items-center border border-yellow-400 z-10">
                            <CopyPlus size={10} className="mr-1" />
                            Used on {img.foundOn.length} pages
                        </div>
                    )}

                    <div className="w-14 h-14 flex-shrink-0 bg-[#0f1524] rounded-lg overflow-hidden flex items-center justify-center border border-slate-800/60 mt-1">
                        <img src={img.src} alt={img.filename} className="w-full h-full object-cover opacity-90" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5Y2EzYWYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHg9IjMiIHk9IjMiIHJ4PSIyIiByeT0iMiIvPjxjaXJjbGUgY3g9IjkiIGN5PSI5IiByPSIyIi8+PHBhdGggZD0ibTIxIDE1LTMuMDgtMy4wOGExLjIgMS4yIDAgMCAwLTEuNzIgMGwtMS44MSAxLjgxTDEyLjkyIDExYTEuMiAxLjIgMCAwIDAtMS43MiAwbC04LjIgOC4xOSIvPjwvc3ZnPg=='}} />
                    </div>
                    <div className="min-w-0 flex-1">
                        <p className="text-sm font-bold text-slate-200 truncate" title={img.filename}>
                        {img.filename}
                        </p>
                        
                        <div className="flex items-center space-x-4 mt-0.5 mb-1">
                            <a href={img.src} target="_blank" rel="noreferrer" className={`text-[11px] font-medium flex items-center transition-colors ${isTemplated ? 'text-red-400 hover:text-red-300' : 'text-emerald-400 hover:text-emerald-300'}`}>
                                <LinkIcon size={10} className="mr-1" /> View Image
                            </a>
                            
                            {/* ONLY show the collapse button if there are multiple pages */}
                            {hasMultiple && (
                                <button onClick={() => setExpanded(!expanded)} className="text-[11px] font-medium text-slate-400 hover:text-slate-200 flex items-center transition-colors focus:outline-none">
                                    <ChevronDown size={12} className={`mr-1 transition-transform duration-200 ${expanded ? 'rotate-180' : ''}`} />
                                    {expanded ? 'Hide pages' : `${img.foundOn.length} pages`}
                                </button>
                            )}
                        </div>
                        
                        {/* Always show if single link, otherwise show when expanded */}
                        {(!hasMultiple || expanded) && (
                            <div className={`flex flex-col gap-1.5 mt-2 pt-2 ${hasMultiple ? 'border-t border-slate-800/60 animate-in fade-in slide-in-from-top-1 duration-200' : ''}`}>
                                {img.foundOn.map((pageUrl, idx) => {
                                    let displayPath = 'Homepage';
                                    try {
                                        const urlObj = new URL(pageUrl);
                                        let pName = urlObj.pathname;
                                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                                        if (pName && pName !== '') displayPath = pName;
                                    } catch(e) {}
                                    return (
                                        <a key={idx} href={pageUrl} target="_blank" rel="noreferrer" className={`inline-flex px-2 py-1 rounded text-[10px] font-medium border truncate w-fit max-w-full transition-colors ${isTemplated ? 'bg-red-500/5 text-red-400/90 border-red-500/20 hover:bg-red-500/10 hover:text-red-300' : 'bg-emerald-500/5 text-emerald-400/90 border-emerald-500/20 hover:bg-emerald-500/10 hover:text-emerald-300'}`} title={`Found on: ${pageUrl}`}>
                                            {displayPath}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main Application ---
        function App() {
            const [builderUrl, setBuilderUrl] = useState('');
            const [templateUrl, setTemplateUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [error, setError] = useState('');
            const [results, setResults] = useState(null);

            // Helper to extract a normalized filename from a URL
            const getFilename = (urlStr) => {
                try {
                    const cleanUrl = urlStr.split('?')[0].split('#')[0];
                    const parts = cleanUrl.split('/');
                    let filename = parts[parts.length - 1];
                    
                    if (filename && filename.includes('.')) {
                        filename = decodeURIComponent(filename).trim();
                        
                        // Prevent redundant image tiles by aggressively stripping CDN resizing suffixes!
                        // Groups variants (e.g. image-1920w.jpg, image-150x150.jpg) into one clean tile.
                        let prevFilename;
                        do {
                            prevFilename = filename;
                            // Strip dimension suffixes like -150x150, _300x300, -1024xauto, -1920w, -1080h
                            filename = filename.replace(/[-_]\d+(?:x\d+|xauto|[wh])(?=\.[a-zA-Z0-9]+$)/i, '');
                            // Strip retina density suffixes like @2x, @3x
                            filename = filename.replace(/@\d+x(?=\.[a-zA-Z0-9]+$)/i, '');
                            // Strip typical builder descriptive suffixes like -mobile, -tablet, -opt, -thumb
                            filename = filename.replace(/[-_](?:mobile|tablet|desktop|thumb|thumbnail|small|medium|large|opt|compressed|resized|scaled|min)(?=\.[a-zA-Z0-9]+$)/i, '');
                        } while (filename !== prevFilename);

                        return filename;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            };

            // Fetch with a hard timeout so a single hanging proxy can't stall the whole crawl
            const PROXY_TIMEOUT_MS = 15000;
            const fetchWithTimeout = async (url, timeoutMs = PROXY_TIMEOUT_MS) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    return await fetch(url, { signal: controller.signal, headers: { 'Accept': 'text/html,*/*' } });
                } finally {
                    clearTimeout(timer);
                }
            };

            // Heuristic: does this look like a bot-check / CAPTCHA / "enable JS" wall
            // rather than real page content? If so we still return the HTML (there may
            // be partial content) but flag it so the UI can warn the user.
            const looksLikeBlockedPage = (html) => {
                if (!html) return true;
                const lower = html.slice(0, 5000).toLowerCase();
                return (
                    lower.includes('cf-browser-verification') ||
                    lower.includes('attention required! | cloudflare') ||
                    lower.includes('checking your browser before accessing') ||
                    lower.includes('enable javascript and cookies to continue') ||
                    lower.includes('please verify you are a human') ||
                    lower.includes('captcha')
                );
            };

            // Multiple CORS proxies, tried in order. Each has its own response shape,
            // so each entry knows how to unwrap its own payload. If one is down,
            // rate-limited, or returns junk, we fall through to the next instead of
            // failing the whole page silently.
            const PROXIES = [
                {
                    name: 'allorigins (json)',
                    build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                    parse: async (res) => {
                        const data = await res.json();
                        if (!data || typeof data.contents !== 'string' || !data.contents) {
                            throw new Error('empty/invalid payload');
                        }
                        return data.contents;
                    }
                },
                {
                    name: 'allorigins (raw)',
                    build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    name: 'codetabs',
                    build: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    // corsproxy.io requires the target under a `url=` param — the old
                    // `?${encodeURIComponent(url)}` form (no `url=` key) is silently rejected.
                    name: 'corsproxy.io',
                    build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                    parse: async (res) => res.text()
                },
                {
                    name: 'thingproxy',
                    build: (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
                    parse: async (res) => res.text()
                },
                {
                    // r.jina.ai fetches the page through its own reader/renderer
                    // (executes JS, handles a lot of basic bot-checks) and returns
                    // readable text/markdown, including image links in the form
                    // ![alt](https://.../img.jpg). We don't DOM-parse this — the raw
                    // regex pass in extractDataFromHtml still picks up those image
                    // URLs directly out of the text, which also gives us a shot at
                    // JS-only pages the other proxies can never see.
                    name: 'r.jina.ai (reader)',
                    build: (url) => `https://r.jina.ai/${url}`,
                    parse: async (res) => res.text()
                },
            ];

            // Helper to fetch HTML through fallback proxies. Never fails silently:
            // if every proxy fails we throw a descriptive error listing exactly what
            // went wrong with each one, so the caller can surface real feedback
            // instead of a bare "0 results".
            //
            // Runs the full proxy chain, and if EVERY proxy fails on the first pass,
            // waits briefly and runs the whole chain again once more — a lot of these
            // free proxies fail transiently under rate limiting rather than being
            // truly down, and a short retry clears a surprising number of them.
            const attemptProxyChain = async (finalUrl) => {
                const attemptErrors = [];
                for (const proxy of PROXIES) {
                    try {
                        const response = await fetchWithTimeout(proxy.build(finalUrl));
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const html = await proxy.parse(response);
                        if (!html || html.length < 30) throw new Error('empty response body');
                        return { html, blocked: looksLikeBlockedPage(html), proxyUsed: proxy.name };
                    } catch (err) {
                        const reason = err.name === 'AbortError' ? 'timed out' : (err.message || 'unknown error');
                        attemptErrors.push(`${proxy.name} \u2192 ${reason}`);
                    }
                }
                return { errors: attemptErrors };
            };

            const fetchProxy = async (finalUrl) => {
                let result = await attemptProxyChain(finalUrl);
                if (!result.errors) return result;

                const firstPassErrors = result.errors;
                await new Promise(r => setTimeout(r, 1200));
                result = await attemptProxyChain(finalUrl);
                if (!result.errors) return result;

                // Diagnose the failure pattern so the user gets an actionable message
                // instead of a wall of proxy names.
                const allErrors = [...firstPassErrors, ...result.errors];
                const sawHttpStatus = allErrors.some(e => /HTTP \d{3}/.test(e));
                const sawOnlyNetworkErrors = allErrors.every(e => /timed out|failed to fetch|empty response|empty\/invalid payload/i.test(e));

                let hint;
                if (sawHttpStatus && !sawOnlyNetworkErrors) {
                    hint = 'at least one proxy reached the target and got an HTTP error back (e.g. 403) \u2014 the site itself is likely blocking automated/anonymous requests, or this is a private/preview link that requires being logged in.';
                } else if (sawOnlyNetworkErrors) {
                    hint = 'every proxy failed at the network level (timeout / failed to fetch) rather than returning an HTTP error \u2014 this usually means your current network, firewall, or browser policy is blocking these proxy domains outright. Try a different network, or disable any content-blocking extensions/policies for this page.';
                } else {
                    hint = 'see the per-proxy errors below for details.';
                }

                throw new Error(`All proxies failed for ${finalUrl} after 2 attempts (${hint}) [${allErrors.join(' | ')}]`);
            };

            // Helper to process a single page's HTML to find images AND internal links
            const extractDataFromHtml = (htmlContent, currentUrl, startUrl) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                const imagesList = [];
                const internalLinks = [];
                const startUrlObj = new URL(startUrl);

                // PROCESS IMAGE HELPER
                const processImageSrc = (src) => {
                    if (!src || src.startsWith('data:')) return;
                    
                    let cleanSrc = src;
                    cleanSrc = cleanSrc.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                    
                    try {
                        const urlObj = new URL(cleanSrc, currentUrl);
                        cleanSrc = urlObj.toString();
                    } catch (e) { return; }

                    const filename = getFilename(cleanSrc);
                    if (filename) {
                        imagesList.push({ src: cleanSrc, filename, foundOn: currentUrl });
                    }
                };

                // --- 1. EXTRACT LINKS & LIGHTBOX GALLERIES ---
                const processHref = (href) => {
                    if (!href || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
                    
                    // IF href is actually an image (Lightbox gallery popup link)
                    if (href.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                        processImageSrc(href);
                        return;
                    }

                    try {
                        const linkUrlObj = new URL(href, currentUrl);
                        if (linkUrlObj.hostname !== startUrlObj.hostname) return;
                        
                        const searchParams = new URLSearchParams(linkUrlObj.search);
                        const startParams = new URLSearchParams(startUrlObj.search);
                        startParams.forEach((value, key) => {
                            if (!searchParams.has(key)) searchParams.set(key, value);
                        });
                        linkUrlObj.search = searchParams.toString();
                        linkUrlObj.hash = '';
                        internalLinks.push(linkUrlObj.toString());
                    } catch (e) {}
                };

                // Standard a-tag links
                doc.querySelectorAll('a[href]').forEach(a => processHref(a.getAttribute('href')));

                // Builder specific links (dropdowns, dead-link wrappers)
                doc.querySelectorAll('[data-href], [data-url], [data-link]').forEach(el => {
                    processHref(el.getAttribute('data-href') || el.getAttribute('data-url') || el.getAttribute('data-link'));
                });

                // --- 2. EXTRACT IMAGES (Extremely Aggressive) ---
                
                // Helper: parse a full srcset string ("a.jpg 480w, b.jpg 800w") and
                // process every candidate, not just the first, so we don't miss the
                // real full-size asset when only a small variant is listed first.
                const processSrcset = (srcset) => {
                    if (!srcset) return;
                    srcset.split(',').forEach(part => {
                        const candidate = part.trim().split(/\s+/)[0];
                        if (candidate) processImageSrc(candidate);
                    });
                };

                // Standard & Lazy Loaded images (covers the most common lazy-load
                // attribute names used by builder platforms and lazy-load plugins)
                doc.querySelectorAll('img, source').forEach(img => {
                    const directSrc = img.getAttribute('src')
                        || img.getAttribute('data-src')
                        || img.getAttribute('data-original')
                        || img.getAttribute('data-lazy')
                        || img.getAttribute('data-lazy-src')
                        || img.getAttribute('data-bg')
                        || img.getAttribute('data-background');
                    if (directSrc) processImageSrc(directSrc);
                    processSrcset(img.getAttribute('srcset') || img.getAttribute('data-srcset'));
                });

                // <noscript> fallback images: many lazy-load plugins (and page builders
                // like Duda/Wix/WordPress) render the REAL <img src="..."> only inside
                // a <noscript> block as a no-JS fallback, while the visible tag carries
                // just a lazy-load placeholder. DOMParser does NOT parse noscript
                // contents as elements, so we have to re-parse its text content.
                doc.querySelectorAll('noscript').forEach(ns => {
                    const raw = ns.textContent;
                    if (raw && raw.toLowerCase().includes('<img')) {
                        try {
                            const fragDoc = parser.parseFromString(raw, 'text/html');
                            fragDoc.querySelectorAll('img, source').forEach(img => {
                                const s = img.getAttribute('src') || img.getAttribute('data-src');
                                if (s) processImageSrc(s);
                                processSrcset(img.getAttribute('srcset'));
                            });
                        } catch (e) {}
                    }
                });

                // Social/meta preview images — often the hero/banner image and a
                // useful signal even when the rest of the page is JS-rendered
                doc.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"]').forEach(m => {
                    processImageSrc(m.getAttribute('content'));
                });

                // Scan EVERY attribute on EVERY element to prevent missing custom hidden images
                doc.querySelectorAll('*').forEach(el => {
                    Array.from(el.attributes).forEach(attr => {
                        const val = attr.value;
                        if (!val) return;

                        // Check if attribute contains an inline style/url format
                        if (val.includes('url(')) {
                            const urls = val.match(/url\(['"]?(.*?)['"]?\)/g);
                            if (urls) {
                                urls.forEach(u => {
                                    const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                    if (match && match[1] && !match[1].startsWith('data:')) processImageSrc(match[1]);
                                });
                            }
                        }
                        
                        // Check if the attribute value IS literally an image URL
                        if (val.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                            processImageSrc(val);
                        }
                    });
                });

                // Internal <style> tags
                doc.querySelectorAll('style').forEach(styleTag => {
                    const cssText = styleTag.textContent;
                    if (cssText) {
                        const urls = cssText.match(/url\(['"]?(.*?)['"]?\)/g);
                        if (urls) {
                            urls.forEach(u => {
                                const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                if (match && match[1] && !match[1].startsWith('data:') && !match[1].endsWith('.woff') && !match[1].endsWith('.woff2')) {
                                    processImageSrc(match[1]);
                                }
                            });
                        }
                    }
                });

                // --- 3. BRUTE FORCE RAW HTML PARSE (For Javascript/JSON galleries & absolute/relative paths) ---
                const rawUrlRegex = /(?:https?:\/\/|\/)[^\s"',;<>()[\]]+\.(?:jpg|jpeg|png|gif|webp|svg)(?:\?[^\s"',;<>()[\]]+)?/gi;
                const rawMatches = htmlContent.match(rawUrlRegex);
                if (rawMatches) {
                    rawMatches.forEach(url => processImageSrc(url));
                }

                // Detect a near-empty "app shell" (e.g. <div id="root"></div> plus a
                // bundle.js) — a strong sign this page only renders its real content
                // client-side via JavaScript, which a static proxy fetch can never see.
                const bodyText = (doc.body && doc.body.textContent) ? doc.body.textContent.trim() : '';
                const bodyElementCount = doc.body ? doc.body.querySelectorAll('*').length : 0;
                const looksLikeEmptySpaShell = imagesList.length === 0 && bodyText.length < 40 && bodyElementCount < 15;

                return { images: imagesList, links: [...new Set(internalLinks)], looksLikeEmptySpaShell };
            };

            // FULL SITE CRAWLER: Uses a dynamic deep-dive queue to explore links found on subpages
            const crawlSiteAndExtractImages = async (startUrl, siteLabel) => {
                let finalStartUrl = startUrl;
                if (!/^https?:\/\//i.test(finalStartUrl)) {
                    finalStartUrl = 'https://' + finalStartUrl;
                }

                const allImages = [];
                const visited = new Set();
                const queue = [finalStartUrl];
                const maxPages = 40; // Deep crawl limit
                const batchSize = 5;

                const prioritizeKeywords = ['service', 'services', 'gallery', 'portfolio', 'about', 'our-work'];

                // Collected, human-readable problems encountered along the way —
                // surfaced in the UI instead of being swallowed into a bare 0-results.
                const warnings = [];
                let pagesFetchedOk = 0;

                // Continue scanning as long as there are pages in the queue (up to the limit)
                while (queue.length > 0 && visited.size < maxPages) {
                    const currentBatch = [];
                    // Take the next batch of unvisited pages
                    while (queue.length > 0 && currentBatch.length < batchSize && visited.size + currentBatch.length < maxPages) {
                        const url = queue.shift();
                        if (!visited.has(url)) {
                            visited.add(url);
                            currentBatch.push(url);
                        }
                    }

                    if (currentBatch.length === 0) break;

                    setStatusText(`Scanning ${siteLabel}: Crawled ${visited.size} pages...`);

                    // Fetch the batch of pages simultaneously
                    const batchPromises = currentBatch.map(async (url) => {
                        try {
                            const { html, blocked, proxyUsed } = await fetchProxy(url);
                            pagesFetchedOk++;
                            if (blocked) {
                                warnings.push(`${siteLabel}: ${url} looks like a bot-check/CAPTCHA page (via ${proxyUsed}) — its images may be missing from results.`);
                            }
                            const result = extractDataFromHtml(html, url, finalStartUrl);
                            if (result.looksLikeEmptySpaShell) {
                                warnings.push(`${siteLabel}: ${url} returned almost no HTML content — it's likely a JavaScript-rendered app whose images can't be seen by a static scan.`);
                            }
                            return result;
                        } catch (err) {
                            warnings.push(`${siteLabel}: Failed to scan ${url} — ${err.message}`);
                            return { images: [], links: [] };
                        }
                    });

                    const batchResults = await Promise.all(batchPromises);

                    // Add extracted images and queue up newly discovered links
                    batchResults.forEach(({ images, links }) => {
                        allImages.push(...(images || []));

                        (links || []).forEach(link => {
                            if (!visited.has(link) && !queue.includes(link)) {
                                queue.push(link);
                            }
                        });
                    });

                    // Sort the queue to always prioritize scanning services & galleries first
                    queue.sort((a, b) => {
                        const aStr = a.toLowerCase();
                        const bStr = b.toLowerCase();
                        const aMatch = prioritizeKeywords.some(k => aStr.includes(k));
                        const bMatch = prioritizeKeywords.some(k => bStr.includes(k));
                        
                        if (aMatch && !bMatch) return -1;
                        if (!aMatch && bMatch) return 1;
                        return 0;
                    });

                    // Small stagger between batches — several of the free proxies
                    // (codetabs, thingproxy) apply per-second rate limits, and firing
                    // batch after batch back-to-back trips them into 429s/blocks.
                    if (queue.length > 0 && visited.size < maxPages) {
                        await new Promise(r => setTimeout(r, 350));
                    }
                }

                if (pagesFetchedOk === 0) {
                    warnings.push(`${siteLabel}: Every page fetch failed — no pages could be reached through any proxy. See details above.`);
                }

                // Group by filename (case-insensitive key, since some CDNs vary
                // casing for what's otherwise the identical asset) and collect all
                // unique URLs where the image was found.
                const imageMap = new Map();
                allImages.forEach(item => {
                    let pathKey = 'Homepage';
                    try {
                        const urlObj = new URL(item.foundOn);
                        let pName = urlObj.pathname;
                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                        if (pName && pName !== '') pathKey = pName;
                    } catch(e) {}

                    const matchKey = item.filename.toLowerCase();

                    if (!imageMap.has(matchKey)) {
                        const foundOnMap = new Map();
                        foundOnMap.set(pathKey, item.foundOn);
                        
                        imageMap.set(matchKey, {
                            src: item.src,
                            filename: item.filename,
                            matchKey,
                            foundOnMap: foundOnMap
                        });
                    } else {
                        imageMap.get(matchKey).foundOnMap.set(pathKey, item.foundOn);
                    }
                });

                const uniqueImages = Array.from(imageMap.values()).map(img => {
                    const foundUrls = Array.from(img.foundOnMap.values());
                    delete img.foundOnMap;
                    return {
                        ...img,
                        foundOn: foundUrls
                    };
                });
                
                return { images: uniqueImages, warnings, pagesScanned: visited.size };
            };

            const handleScan = async (e) => {
                e.preventDefault();
                if (!builderUrl || !templateUrl) {
                    setError('Please provide both URLs.');
                    return;
                }

                setLoading(true);
                setError('');
                setResults(null);

                try {
                    const builderResult = await crawlSiteAndExtractImages(builderUrl, 'Builder Site');
                    const templateResult = await crawlSiteAndExtractImages(templateUrl, 'Template Site');

                    const builderImages = builderResult.images;
                    const templateImages = templateResult.images;
                    const warnings = [...builderResult.warnings, ...templateResult.warnings];

                    setStatusText('Comparing filenames across all pages...');

                    // Case-insensitive match on the normalized filename key
                    const templateFilenames = new Set(templateImages.map(img => img.matchKey));
                    const templated = builderImages.filter(img => templateFilenames.has(img.matchKey));
                    const uniqueToBuilder = builderImages.filter(img => !templateFilenames.has(img.matchKey));

                    // If literally nothing was found on either site, don't just show
                    // empty lists — tell the user why, since 0/0 usually means the
                    // scan itself broke rather than the sites being genuinely empty.
                    if (builderImages.length === 0 && templateImages.length === 0) {
                        const warningText = warnings.join(' ').toLowerCase();
                        const sawHttpBlock = /http \d{3}/.test(warningText);
                        const sawOnlyNetworkIssues = warnings.length > 0 && !sawHttpBlock;

                        let reason;
                        if (sawHttpBlock) {
                            reason = 'At least one proxy reached the site but got an HTTP error back — the site is likely blocking automated/anonymous requests, or the URL is a private preview link that requires being logged in to view.';
                        } else if (sawOnlyNetworkIssues) {
                            reason = 'Every proxy attempt failed at the network level (timeouts / failed to fetch) rather than getting a response from the site. This points to your current network, firewall, or browser policy blocking the proxy services themselves — try a different network or disabling content-blocking extensions for this page.';
                        } else {
                            reason = 'This usually means the sites blocked automated fetching, render their images entirely via JavaScript, or the free CORS proxies are temporarily unavailable.';
                        }
                        setError(`No images were found on either site after scanning all reachable pages. ${reason} Check the warnings below for the specific reason per page.`);
                    }

                    setResults({
                        builderCount: builderImages.length,
                        templateCount: templateImages.length,
                        templated,
                        uniqueToBuilder,
                        warnings,
                    });

                } catch (err) {
                    setError(err.message || 'An error occurred while scanning. Ensure adblockers are disabled for this site.');
                } finally {
                    setLoading(false);
                    setStatusText('');
                }
            };

            return (
                <div className="min-h-screen font-sans p-6">
                <div className="max-w-4xl mx-auto space-y-8">
                    
                    {/* Header Section */}
                    <div className="bg-[#151c2c] rounded-2xl shadow-2xl border border-slate-800/60 p-8 relative overflow-hidden">
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-24 bg-cyan-500/10 blur-[60px] pointer-events-none"></div>

                    <div className="flex flex-col items-center text-center mb-8 relative z-10">
                        <div className="p-3 bg-cyan-400/10 text-cyan-400 rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.2)] mb-4 border border-cyan-400/20">
                        <ImageIcon size={28} />
                        </div>
                        <h1 className="text-3xl font-bold text-white mb-2">Templated Image Finder</h1>
                        <p className="text-slate-400 max-w-2xl text-sm">
                        Fast scan to compare all pages, standard images, background images, and hidden galleries. Made by JSB
                        </p>
                    </div>

                    {/* Form */}
                    <form onSubmit={handleScan} className="mt-8 space-y-6 relative z-10">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="block text-sm font-medium text-slate-300">Builder Link</label>
                            <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <LinkIcon size={16} className="text-slate-500" />
                            </div>
                            <input
                                type="text"
                                value={builderUrl}
                                onChange={(e) => setBuilderUrl(e.target.value)}
                                placeholder="Paste the builder link here..."
                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                required
                            />
                            </div>
                        </div>
                        
                        <div className="space-y-2">
                            <label className="block text-sm font-medium text-slate-300">Template Link</label>
                            <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <LinkIcon size={16} className="text-slate-500" />
                            </div>
                            <input
                                type="text"
                                value={templateUrl}
                                onChange={(e) => setTemplateUrl(e.target.value)}
                                placeholder="Paste the template link here..."
                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                required
                            />
                            </div>
                        </div>
                        </div>

                        {error && (
                        <div className="p-4 bg-red-950/30 border border-red-900/50 text-red-400 rounded-xl flex items-start space-x-3">
                            <AlertCircle size={20} className="mt-0.5 flex-shrink-0" />
                            <p className="text-sm">{error}</p>
                        </div>
                        )}

                        <div className="flex flex-col md:flex-row items-center gap-4 pt-2">
                        <button
                            type="submit"
                            disabled={loading}
                            className="w-full md:w-auto px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-xl shadow-[0_0_15px_rgba(8,145,178,0.3)] transition-all flex items-center justify-center space-x-2 disabled:opacity-50 disabled:bg-slate-800 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed"
                        >
                            {loading ? (
                            <React.Fragment>
                                <Loader2 size={18} className="animate-spin" />
                                <span>Fast Scanning...</span>
                            </React.Fragment>
                            ) : (
                            <React.Fragment>
                                <Search size={18} />
                                <span>Find Templated Images</span>
                            </React.Fragment>
                            )}
                        </button>
                        
                        {/* Live Status Indicator */}
                        {statusText && (
                            <div className="flex items-center space-x-2 text-sm font-medium text-cyan-400 bg-cyan-950/30 px-4 py-3 rounded-xl animate-pulse border border-cyan-900/50">
                            <Loader2 size={16} className="animate-spin" />
                            <span>{statusText}</span>
                            </div>
                        )}
                        </div>
                    </form>
                    </div>

                    {/* Focused Results Section */}
                    {results && (
                    <div className="space-y-6 animate-in fade-in duration-500">
                        
                        {/* KPI Cards */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-[#151c2c] p-5 rounded-2xl border border-red-900/30 flex flex-col justify-center items-center text-center shadow-lg relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-b from-red-500/5 to-transparent pointer-events-none"></div>
                            <p className="text-[11px] text-red-400/80 font-bold uppercase tracking-wider mb-1 relative z-10">Templated</p>
                            <span className="text-4xl font-black text-red-500 relative z-10">{results.templated.length}</span>
                            <p className="text-[10px] text-red-500/60 mt-1 relative z-10">To replace</p>
                        </div>
                        
                        <div className="bg-[#151c2c] p-5 rounded-2xl border border-emerald-900/30 flex flex-col justify-center items-center text-center shadow-lg relative overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-b from-emerald-500/5 to-transparent pointer-events-none"></div>
                            <p className="text-[11px] text-emerald-400/80 font-bold uppercase tracking-wider mb-1 relative z-10">Custom</p>
                            <span className="text-4xl font-black text-emerald-500 relative z-10">{results.uniqueToBuilder.length}</span>
                            <p className="text-[10px] text-emerald-500/60 mt-1 relative z-10">Not templated</p>
                        </div>

                        <div className="bg-[#151c2c] p-5 rounded-2xl border border-slate-800 flex flex-col justify-center items-center text-center shadow-lg">
                            <p className="text-[11px] text-slate-500 font-bold uppercase tracking-wider mb-1">Builder Total</p>
                            <span className="text-4xl font-black text-white">{results.builderCount}</span>
                            <p className="text-[10px] text-slate-500 mt-1">Images scanned</p>
                        </div>

                        <div className="bg-[#151c2c] p-5 rounded-2xl border border-slate-800 flex flex-col justify-center items-center text-center shadow-lg">
                            <p className="text-[11px] text-slate-500 font-bold uppercase tracking-wider mb-1">Template Total</p>
                            <span className="text-4xl font-black text-white">{results.templateCount}</span>
                            <p className="text-[10px] text-slate-500 mt-1">Images scanned</p>
                        </div>
                        </div>

                        {/* Scan Warnings: surfaces per-page/proxy failures instead of a silent 0 */}
                        {results.warnings && results.warnings.length > 0 && (
                        <details className="bg-amber-950/20 border border-amber-900/40 rounded-xl p-4 text-amber-300 open:pb-2">
                            <summary className="cursor-pointer font-semibold flex items-center text-sm select-none">
                                <AlertTriangle size={14} className="mr-2 flex-shrink-0" />
                                {results.warnings.length} issue{results.warnings.length === 1 ? '' : 's'} encountered while scanning — click to view
                            </summary>
                            <ul className="mt-3 space-y-1.5 list-disc list-inside max-h-56 overflow-y-auto custom-scroll pr-2">
                                {results.warnings.map((w, i) => (
                                    <li key={i} className="text-xs text-amber-300/80 leading-relaxed">{w}</li>
                                ))}
                            </ul>
                        </details>
                        )}

                        {/* Split Lists: Templated vs Custom */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        
                        {/* Templated Images List (RED) */}
                        <div className="bg-[#151c2c] rounded-2xl shadow-xl border border-slate-800 overflow-hidden flex flex-col">
                            <div className="bg-[#0f1524] p-4 border-b border-slate-800/60 flex items-center justify-between">
                            <h3 className="font-semibold text-slate-200 flex items-center text-sm">
                                <ImageIcon size={16} className="mr-2 text-red-500" /> 
                                Templated Images
                            </h3>
                            <span className="px-2.5 py-0.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full text-xs font-bold shadow-sm">
                                {results.templated.length}
                            </span>
                            </div>
                            
                            <div className="p-4 max-h-[700px] overflow-y-auto bg-[#0B1120] flex-1 custom-scroll">
                            {results.templated.length === 0 ? (
                                <div className="text-center py-12 bg-[#151c2c] rounded-xl border border-dashed border-slate-700">
                                <CheckCircle size={36} className="mx-auto text-emerald-500 mb-3 opacity-80" />
                                <h4 className="text-sm font-bold text-slate-200">Site is fully custom!</h4>
                                <p className="text-xs text-slate-500 mt-1">No matching filenames found.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                {results.templated.map((img, i) => (
                                    <ImageCard key={i} img={img} isTemplated={true} />
                                ))}
                                </div>
                            )}
                            </div>
                        </div>

                        {/* Custom Images List (GREEN) */}
                        <div className="bg-[#151c2c] rounded-2xl shadow-xl border border-slate-800 overflow-hidden flex flex-col">
                            <div className="bg-[#0f1524] p-4 border-b border-slate-800/60 flex items-center justify-between">
                            <h3 className="font-semibold text-slate-200 flex items-center text-sm">
                                <CheckCircle size={16} className="mr-2 text-emerald-500" /> 
                                Custom Images
                            </h3>
                            <span className="px-2.5 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-bold shadow-sm">
                                {results.uniqueToBuilder.length}
                            </span>
                            </div>
                            
                            <div className="p-4 max-h-[700px] overflow-y-auto bg-[#0B1120] flex-1 custom-scroll">
                            {results.uniqueToBuilder.length === 0 ? (
                                <div className="text-center py-12 bg-[#151c2c] rounded-xl border border-dashed border-slate-700">
                                <AlertTriangle size={36} className="mx-auto text-yellow-500 mb-3 opacity-80" />
                                <h4 className="text-sm font-bold text-slate-200">No custom images</h4>
                                <p className="text-xs text-slate-500 mt-1">All images appear to be from the template.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                {results.uniqueToBuilder.map((img, i) => (
                                    <ImageCard key={i} img={img} isTemplated={false} />
                                ))}
                                </div>
                            )}
                            </div>
                        </div>

                        </div>
                    </div>
                    )}

                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
