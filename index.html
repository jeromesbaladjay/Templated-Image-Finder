<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templated Image Finder</title>
    <link rel="icon" type="image/png" href="Logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for dark mode */
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0B1120; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        .custom-scroll:hover::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-[#0B1120] text-slate-300 selection:bg-cyan-500/30 selection:text-cyan-100 antialiased">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Inline SVG Icons ---
        const Search = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const ImageIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.08-3.08a1.2 1.2 0 0 0-1.72 0l-1.81 1.81L12.92 11a1.2 1.2 0 0 0-1.72 0l-8.2 8.19"/></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const Loader2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        );
        const LinkIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        );
        const CopyPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="15" y1="12" x2="15" y2="18"/><line x1="12" y1="15" x2="18" y2="15"/><rect x="8" y="8" width="14" height="14" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const ChevronDown = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );

        // --- Collapsible Image Card Component ---
        const ImageCard = ({ img, isTemplated }) => {
            const [expanded, setExpanded] = useState(false);
            const hasMultiple = img.foundOn.length > 1;

            return (
                <div className={`flex items-start space-x-4 p-3 bg-[#151c2c] rounded-xl border border-slate-800 shadow-sm transition-all relative ${isTemplated ? 'hover:border-red-500/40' : 'hover:border-emerald-500/40'}`}>
                    
                    {/* Duplication Indicator Badge */}
                    {hasMultiple && (
                        <div className="absolute -top-2 -right-2 bg-yellow-500/90 text-yellow-950 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-md flex items-center border border-yellow-400 z-10">
                            <CopyPlus size={10} className="mr-1" />
                            Used on {img.foundOn.length} pages
                        </div>
                    )}

                    <div className="w-14 h-14 flex-shrink-0 bg-[#0f1524] rounded-lg overflow-hidden flex items-center justify-center border border-slate-800/60 mt-1">
                        <img src={img.src} alt={img.filename} className="w-full h-full object-cover opacity-90" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5Y2EzYWYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cmVjdCB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHg9IjMiIHk9IjMiIHJ4PSIyIiByeT0iMiIvPjxjaXJjbGUgY3g9IjkiIGN5PSI5IiByPSIyIi8+PHBhdGggZD0ibTIxIDE1LTMuMDgtMy4wOGExLjIgMS4yIDAgMCAwLTEuNzIgMGwtMS44MSAxLjgxTDEyLjkyIDExYTEuMiAxLjIgMCAwIDAtMS43MiAwbC04LjIgOC4xOSIvPjwvc3ZnPg=='}} />
                    </div>
                    <div className="min-w-0 flex-1">
                        <p className="text-sm font-bold text-slate-200 truncate" title={img.filename}>
                        {img.filename}
                        </p>
                        
                        <div className="flex items-center space-x-4 mt-0.5 mb-1">
                            <a href={img.src} target="_blank" rel="noreferrer" className={`text-[11px] font-medium flex items-center transition-colors ${isTemplated ? 'text-red-400 hover:text-red-300' : 'text-emerald-400 hover:text-emerald-300'}`}>
                                <LinkIcon size={10} className="mr-1" /> View Image
                            </a>
                            
                            {hasMultiple && (
                                <button onClick={() => setExpanded(!expanded)} className="text-[11px] font-medium text-slate-400 hover:text-slate-200 flex items-center transition-colors focus:outline-none">
                                    <ChevronDown size={12} className={`mr-1 transition-transform duration-200 ${expanded ? 'rotate-180' : ''}`} />
                                    {expanded ? 'Hide pages' : `${img.foundOn.length} pages`}
                                </button>
                            )}
                        </div>
                        
                        {(!hasMultiple || expanded) && (
                            <div className={`flex flex-col gap-1.5 mt-2 pt-2 ${hasMultiple ? 'border-t border-slate-800/60' : ''}`}>
                                {img.foundOn.map((pageUrl, idx) => {
                                    let displayPath = 'Homepage';
                                    try {
                                        const urlObj = new URL(pageUrl);
                                        let pName = urlObj.pathname;
                                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                                        if (pName && pName !== '') displayPath = pName;
                                    } catch(e) {}
                                    return (
                                        <a key={idx} href={pageUrl} target="_blank" rel="noreferrer" className={`inline-flex px-2 py-1 rounded text-[10px] font-medium border truncate w-fit max-w-full transition-colors ${isTemplated ? 'bg-red-500/5 text-red-400/90 border-red-500/20 hover:bg-red-500/10 hover:text-red-300' : 'bg-emerald-500/5 text-emerald-400/90 border-emerald-500/20 hover:bg-emerald-500/10 hover:text-emerald-300'}`} title={`Found on: ${pageUrl}`}>
                                            {displayPath}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main Application ---
        function App() {
            const [builderUrl, setBuilderUrl] = useState('');
            const [templateUrl, setTemplateUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [error, setError] = useState('');
            const [results, setResults] = useState(null);

            const getFilename = (urlStr) => {
                try {
                    const cleanUrl = urlStr.split('?')[0].split('#')[0];
                    const parts = cleanUrl.split('/');
                    let filename = parts[parts.length - 1];
                    
                    if (filename && filename.includes('.')) {
                        filename = decodeURIComponent(filename).trim();
                        let prevFilename;
                        do {
                            prevFilename = filename;
                            filename = filename.replace(/[-_]\d+(?:x\d+|xauto|[wh])(?=\.[a-zA-Z0-9]+$)/i, '');
                            filename = filename.replace(/[-_](?:mobile|tablet|desktop|thumb|thumbnail|small|medium|large|opt)(?=\.[a-zA-Z0-9]+$)/i, '');
                        } while (filename !== prevFilename);

                        return filename;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            };

            // Enhanced proxy crawler with fixed syntax and an additional fallback tier
            const fetchProxy = async (finalUrl) => {
                const encodedUrl = encodeURIComponent(finalUrl);
                
                // Proxy 1: AllOrigins
                try {
                    const response = await fetch(`https://api.allorigins.win/get?url=${encodedUrl}`);
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    const data = await response.json();
                    if (data.contents) return data.contents;
                } catch (err) {
                    console.warn("Proxy 1 (AllOrigins) failed:", err.message);
                }

                // Proxy 2: CodeTabs
                try {
                    const response = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`);
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    return await response.text();
                } catch (err) {
                    console.warn("Proxy 2 (CodeTabs) failed:", err.message);
                }

                // Proxy 3: CorsProxy.io (Fixed structural query parameter)
                try {
                    const response = await fetch(`https://corsproxy.io/?url=${encodedUrl}`);
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    return await response.text();
                } catch (err) {
                    console.warn("Proxy 3 (CorsProxy.io) failed:", err.message);
                }

                // Proxy 4: Cors.eu.org (Fresh fallback tier)
                try {
                    const response = await fetch(`https://cors.eu.org/${finalUrl}`);
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    return await response.text();
                } catch (err) {
                    console.warn("Proxy 4 (Cors.eu.org) failed:", err.message);
                }

                throw new Error("All proxy attempts failed. Open public proxies might be rate-limited right now, or your browser's Adblocker/Shields are blocking the connections.");
            };

            const extractDataFromHtml = (htmlContent, currentUrl, startUrl) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                const imagesList = [];
                const internalLinks = [];
                const startUrlObj = new URL(startUrl);

                const processImageSrc = (src) => {
                    if (!src || src.startsWith('data:')) return;
                    let cleanSrc = src.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                    
                    try {
                        const urlObj = new URL(cleanSrc, currentUrl);
                        cleanSrc = urlObj.toString();
                    } catch (e) { return; }

                    const filename = getFilename(cleanSrc);
                    if (filename) {
                        imagesList.push({ src: cleanSrc, filename, foundOn: currentUrl });
                    }
                };

                const processHref = (href) => {
                    if (!href || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
                    if (href.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                        processImageSrc(href);
                        return;
                    }

                    try {
                        const linkUrlObj = new URL(href, currentUrl);
                        if (linkUrlObj.hostname !== startUrlObj.hostname) return;
                        
                        const searchParams = new URLSearchParams(linkUrlObj.search);
                        const startParams = new URLSearchParams(startUrlObj.search);
                        startParams.forEach((value, key) => {
                            if (!searchParams.has(key)) searchParams.set(key, value);
                        });
                        linkUrlObj.search = searchParams.toString();
                        linkUrlObj.hash = '';
                        internalLinks.push(linkUrlObj.toString());
                    } catch (e) {}
                };

                doc.querySelectorAll('a[href]').forEach(a => processHref(a.getAttribute('href')));
                doc.querySelectorAll('[data-href], [data-url], [data-link]').forEach(el => {
                    processHref(el.getAttribute('data-href') || el.getAttribute('data-url') || el.getAttribute('data-link'));
                });

                doc.querySelectorAll('img, source').forEach(img => {
                    const src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-original') || img.getAttribute('srcset');
                    if (src) {
                        const firstSrc = src.split(',')[0].trim().split(' ')[0];
                        processImageSrc(firstSrc);
                    }
                });

                doc.querySelectorAll('*').forEach(el => {
                    Array.from(el.attributes).forEach(attr => {
                        const val = attr.value;
                        if (!val) return;
                        if (val.includes('url(')) {
                            const urls = val.match(/url\(['"]?(.*?)['"]?\)/g);
                            if (urls) {
                                urls.forEach(u => {
                                    const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                    if (match && match[1] && !match[1].startsWith('data:')) processImageSrc(match[1]);
                                });
                            }
                        }
                        if (val.match(/\.(jpeg|jpg|gif|png|svg|webp)(?:\?.*)?$/i)) {
                            processImageSrc(val);
                        }
                    });
                });

                doc.querySelectorAll('style').forEach(styleTag => {
                    const cssText = styleTag.textContent;
                    if (cssText) {
                        const urls = cssText.match(/url\(['"]?(.*?)['"]?\)/g);
                        if (urls) {
                            urls.forEach(u => {
                                const match = u.match(/url\(['"]?(.*?)['"]?\)/);
                                if (match && match[1] && !match[1].startsWith('data:') && !match[1].endsWith('.woff') && !match[1].endsWith('.woff2')) {
                                    processImageSrc(match[1]);
                                }
                            });
                        }
                    }
                });

                const rawUrlRegex = /(?:https?:\/\/|\/)[^\s"',;<>()[\]]+\.(?:jpg|jpeg|png|gif|webp|svg)(?:\?[^\s"',;<>()[\]]+)?/gi;
                const rawMatches = htmlContent.match(rawUrlRegex);
                if (rawMatches) {
                    rawMatches.forEach(url => processImageSrc(url));
                }

                return { images: imagesList, links: [...new Set(internalLinks)] };
            };

            const crawlSiteAndExtractImages = async (startUrl, siteLabel) => {
                let finalStartUrl = startUrl.trim();
                if (!/^https?:\/\//i.test(finalStartUrl)) {
                    finalStartUrl = 'https://' + finalStartUrl;
                }

                const allImages = [];
                const visited = new Set();
                const queue = [finalStartUrl];
                const maxPages = 40; 
                const batchSize = 5;
                const prioritizeKeywords = ['service', 'services', 'gallery', 'portfolio', 'about', 'our-work'];

                while (queue.length > 0 && visited.size < maxPages) {
                    const currentBatch = [];
                    while (queue.length > 0 && currentBatch.length < batchSize && visited.size + currentBatch.length < maxPages) {
                        const url = queue.shift();
                        if (!visited.has(url)) {
                            visited.add(url);
                            currentBatch.push(url);
                        }
                    }

                    if (currentBatch.length === 0) break;
                    setStatusText(`Scanning ${siteLabel}: Crawled ${visited.size} pages...`);

                    const batchPromises = currentBatch.map(async (url) => {
                        try {
                            const html = await fetchProxy(url);
                            return extractDataFromHtml(html, url, finalStartUrl);
                        } catch (err) {
                            return { images: [], links: [] }; 
                        }
                    });

                    const batchResults = await Promise.all(batchPromises);

                    batchResults.forEach(({ images, links }) => {
                        allImages.push(...images);
                        links.forEach(link => {
                            if (!visited.has(link) && !queue.includes(link)) {
                                queue.push(link);
                            }
                        });
                    });

                    queue.sort((a, b) => {
                        const aStr = a.toLowerCase();
                        const bStr = b.toLowerCase();
                        const aMatch = prioritizeKeywords.some(k => aStr.includes(k));
                        const bMatch = prioritizeKeywords.some(k => bStr.includes(k));
                        if (aMatch && !bMatch) return -1;
                        if (!aMatch && bMatch) return 1;
                        return 0;
                    });
                }

                const imageMap = new Map();
                allImages.forEach(item => {
                    let pathKey = 'Homepage';
                    try {
                        const urlObj = new URL(item.foundOn);
                        let pName = urlObj.pathname;
                        if (pName.endsWith('/')) pName = pName.slice(0, -1);
                        if (pName && pName !== '') pathKey = pName;
                    } catch(e) {}

                    if (!imageMap.has(item.filename)) {
                        const foundOnMap = new Map();
                        foundOnMap.set(pathKey, item.foundOn);
                        
                        imageMap.set(item.filename, {
                            src: item.src,
                            filename: item.filename,
                            foundOnMap: foundOnMap
                        });
                    } else {
                        imageMap.get(item.filename).foundOnMap.set(pathKey, item.foundOn);
                    }
                });

                return Array.from(imageMap.values()).map(img => {
                    const foundUrls = Array.from(img.foundOnMap.values());
                    delete img.foundOnMap;
                    return { ...img, foundOn: foundUrls };
                });
            };

            const handleScan = async (e) => {
                e.preventDefault();
                if (!builderUrl || !templateUrl) {
                    setError('Please provide both URLs.');
                    return;
                }

                setLoading(true);
                setError('');
                setResults(null);

                try {
                    const builderImages = await crawlSiteAndExtractImages(builderUrl, 'Builder Site');
                    if(builderImages.length === 0) {
                        throw new Error("Could not pull data from the Builder Link. Try turning off adblockers or checking the URL.");
                    }

                    const templateImages = await crawlSiteAndExtractImages(templateUrl, 'Template Site');
                    
                    setStatusText('Comparing filenames across all pages...');

                    const templateFilenames = new Set(templateImages.map(img => img.filename));
                    const templated = builderImages.filter(img => templateFilenames.has(img.filename));
                    const uniqueToBuilder = builderImages.filter(img => !templateFilenames.has(img.filename));

                    setResults({
                        builderCount: builderImages.length,
                        templateCount: templateImages.length,
                        templated,
                        uniqueToBuilder,
                    });

                } catch (err) {
                    setError(err.message || 'An error occurred while scanning.');
                } {
                    setLoading(false);
                    setStatusText('');
                }
            };

            return (
                <div className="min-h-screen font-sans p-6">
                    <div className="max-w-4xl mx-auto space-y-8">
                        
                        {/* Header Section */}
                        <div className="bg-[#151c2c] rounded-2xl shadow-2xl border border-slate-800/60 p-8 relative overflow-hidden">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-24 bg-cyan-500/10 blur-[60px] pointer-events-none"></div>

                            <div className="flex flex-col items-center text-center mb-8 relative z-10">
                                <div className="p-3 bg-cyan-400/10 text-cyan-400 rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.2)] mb-4 border border-cyan-400/20">
                                    <ImageIcon size={28} />
                                </div>
                                <h1 className="text-3xl font-bold text-white mb-2">Templated Image Finder</h1>
                                <p className="text-slate-400 max-w-2xl text-sm">
                                    Fast scan to compare all pages, standard images, background images, and hidden galleries. Made by JSB
                                </p>
                            </div>

                            {/* Form */}
                            <form onSubmit={handleScan} className="mt-8 space-y-6 relative z-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-300">Builder Link</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <LinkIcon size={16} className="text-slate-500" />
                                            </div>
                                            <input
                                                type="text"
                                                value={builderUrl}
                                                onChange={(e) => setBuilderUrl(e.target.value)}
                                                placeholder="Paste the builder link here..."
                                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                                required
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-300">Template Link</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <LinkIcon size={16} className="text-slate-500" />
                                            </div>
                                            <input
                                                type="text"
                                                value={templateUrl}
                                                onChange={(e) => setTemplateUrl(e.target.value)}
                                                placeholder="Paste the template link here..."
                                                className="pl-10 w-full rounded-xl bg-[#0f1524] border border-slate-700/50 px-4 py-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all outline-none"
                                                required
                                            />
                                        </div>
                                    </div>
                                </div>

                                {error && (
                                    <div className="p-4 bg-red-950/30 border border-red-900/50 text-red-400 rounded-xl flex items-start space-x-3">
                                        <AlertCircle size={20} className="mt-0.5 flex-shrink-0" />
                                        <p className="text-sm">{error}</p>
                                    </div>
                                )}

                                <div className="flex flex-col md:flex-row items-center gap-4 pt-2">
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full md:w-auto px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-xl shadow-[0_0_15px_rgba(8,145,178,0.3)] transition-all flex items-center justify-center space-x-2 disabled:opacity-50 disabled:bg-slate-800 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed"
                                    >
                                        {loading ? (
                                            <React.Fragment>
                                                <Loader2 size={18} className="animate-spin" />
                                                <span>Fast Scanning...</span>
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <Search size={18} />
                                                <span>Find Templated Images</span>
                                            </React.Fragment>
                                        )}
                                    </button>
                                    
                                    {statusText && (
                                        <div className="flex items-center space-x-2 text-sm font-medium text-cyan-400 bg-cyan-950/30 px-4 py-3 rounded-xl animate-pulse border border-cyan-900/50">
                                            <Loader2 size={16} className="animate-spin" />
                                            <span>{statusText}</span>
                                        </div>
                                    )}
                                </div>
                            </form>
                        </div>

                        {/* Focused Results Section */}
                        {results && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
                                    <div className="p-4 bg-[#151c2c] rounded-xl border border-slate-800">
                                        <p className="text-sm text-slate-400">Templated Stock Images Found</p>
                                        <p className="text-2xl font-bold text-red-400">{results.templated.length}</p>
                                    </div>
                                    <div className="p-4 bg-[#151c2c] rounded-xl border border-slate-800">
                                        <p className="text-sm text-slate-400">Unique Custom Images Found</p>
                                        <p className="text-2xl font-bold text-emerald-400">{results.uniqueToBuilder.length}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-3">
                                        <h3 className="text-lg font-bold text-red-400 px-1">Templated (Must Replace)</h3>
                                        <div className="space-y-3 max-h-[500px] overflow-y-auto custom-scroll pr-1">
                                            {results.templated.length === 0 ? (
                                                <p className="text-sm text-slate-500 italic p-3">No template matches left! Clean build.</p>
                                            ) : (
                                                results.templated.map((img, i) => <ImageCard key={i} img={img} isTemplated={true} />)
                                            )}
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <h3 className="text-lg font-bold text-emerald-400 px-1">Unique Builder Images</h3>
                                        <div className="space-y-3 max-h-[500px] overflow-y-auto custom-scroll pr-1">
                                            {results.uniqueToBuilder.length === 0 ? (
                                                <p className="text-sm text-slate-500 italic p-3">No unique images found.</p>
                                            ) : (
                                                results.uniqueToBuilder.map((img, i) => <ImageCard key={i} img={img} isTemplated={false} />)
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
